<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Binary Tree - Left heavy -->
  <g transform="translate(350, 80)">
    <circle cx="100" cy="0" r="28" fill="#1e293b" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/>
    <text x="100" y="8" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="18" font-weight="bold">A</text>

    <circle cx="50" cy="80" r="25" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="50" y="88" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16">B</text>
    <circle cx="150" cy="80" r="25" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="150" y="88" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16">C</text>

    <circle cx="25" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="25" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">D</text>
    <circle cx="75" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="75" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">E</text>
    <circle cx="125" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="125" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">F</text>
    <circle cx="175" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="175" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">G</text>

    <g stroke="#475569" stroke-width="2">
      <line x1="100" y1="28" x2="50" y2="55"/>
      <line x1="100" y1="28" x2="150" y2="55"/>
      <line x1="50" y1="105" x2="25" y2="138"/>
      <line x1="50" y1="105" x2="75" y2="138"/>
      <line x1="150" y1="105" x2="125" y2="138"/>
      <line x1="150" y1="105" x2="175" y2="138"/>
    </g>
  </g>

  <!-- Binary Tree - Right heavy -->
  <g transform="translate(750, 80)">
    <circle cx="100" cy="0" r="28" fill="#1e293b" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/>
    <text x="100" y="8" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="18" font-weight="bold">X</text>

    <circle cx="150" cy="80" r="25" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="150" y="88" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16">Y</text>

    <circle cx="175" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="175" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">Z</text>

    <g stroke="#475569" stroke-width="2">
      <line x1="100" y1="28" x2="150" y2="55"/>
      <line x1="150" y1="105" x2="175" y2="138"/>
    </g>
  </g>

  <!-- Tree traversal indicators -->
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="900" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <g font-family="monospace" font-size="16">
      <text x="30" y="35" fill="#f43f5e">Pre-order:</text>
      <text x="150" y="35" fill="#94a3b8">A → B → D → E → C → F → G</text>

      <text x="30" y="65" fill="#8b5cf6">In-order:</text>
      <text x="140" y="65" fill="#94a3b8">D → B → E → A → F → C → G</text>

      <text x="30" y="90" fill="#22d3ee">Post-order:</text>
      <text x="160" y="90" fill="#94a3b8">D → E → B → F → G → C → A</text>
    </g>
  </g>

  <!-- Recursive formula -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="1100" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="50" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Recursive Pattern:</text>
    <text x="300" y="30" fill="#94a3b8" font-family="monospace" font-size="18">solve(node) = {</text>
    <text x="300" y="55" fill="#94a3b8" font-family="monospace" font-size="18">  if (!node) return;</text>
    <text x="350" y="55" fill="#22d3ee" font-family="monospace" font-size="18">// process</text>
    <text x="300" y="55" fill="#94a3b8" font-family="monospace" font-size="18">  solve(node.left);</text>
    <text x="300" y="55" fill="#94a3b8" font-family="monospace" font-size="18">  solve(node.right);</text>
    <text x="300" y="55" fill="#94a3b8" font-family="monospace" font-size="18">}</text>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Binary Tree Tips</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">二叉树技巧</text>
</svg>
