<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arrayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Array visualization -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="450" height="260" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="225" y="30" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Array Techniques</text>

    <!-- Array cells -->
    <g transform="translate(20, 60)">
      <g font-family="monospace" font-size="18" font-weight="bold">
        <rect x="0" y="0" width="50" height="45" rx="4" fill="#f43f5e" opacity="0.9"/>
        <text x="25" y="30" text-anchor="middle" fill="#fff">5</text>
        <rect x="55" y="0" width="50" height="45" rx="4" fill="#8b5cf6" opacity="0.9"/>
        <text x="80" y="30" text-anchor="middle" fill="#fff">3</text>
        <rect x="110" y="0" width="50" height="45" rx="4" fill="#22d3ee" opacity="0.9"/>
        <text x="135" y="30" text-anchor="middle" fill="#fff">8</text>
        <rect x="165" y="0" width="50" height="45" rx="4" fill="#fbbf24" opacity="0.9"/>
        <text x="190" y="30" text-anchor="middle" fill="#fff">1</text>
        <rect x="220" y="0" width="50" height="45" rx="4" fill="#f43f5e" opacity="0.9"/>
        <text x="245" y="30" text-anchor="middle" fill="#fff">6</text>
        <rect x="275" y="0" width="50" height="45" rx="4" fill="#8b5cf6" opacity="0.9"/>
        <text x="300" y="30" text-anchor="middle" fill="#fff">2</text>
        <rect x="330" y="0" width="50" height="45" rx="4" fill="#22d3ee" opacity="0.9"/>
        <text x="355" y="30" text-anchor="middle" fill="#fff">9</text>
        <rect x="385" y="0" width="50" height="45" rx="4" fill="#fbbf24" opacity="0.9"/>
        <text x="410" y="30" text-anchor="middle" fill="#fff">4</text>
      </g>

      <!-- Indices -->
      <g font-family="monospace" font-size="10" fill="#64748b">
        <text x="25" y="58" text-anchor="middle">0</text>
        <text x="80" y="58" text-anchor="middle">1</text>
        <text x="135" y="58" text-anchor="middle">2</text>
        <text x="190" y="58" text-anchor="middle">3</text>
        <text x="245" y="58" text-anchor="middle">4</text>
        <text x="300" y="58" text-anchor="middle">5</text>
        <text x="355" y="58" text-anchor="middle">6</text>
        <text x="410" y="58" text-anchor="middle">7</text>
      </g>
    </g>

    <!-- Techniques list -->
    <g transform="translate(20, 140)">
      <text x="0" y="0" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Key Techniques:</text>
      <g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
        <text x="0" y="25" fill="#f43f5e">●</text>
        <text x="20" y="25">Two Pointers (快慢/对撞)</text>
        <text x="0" y="45" fill="#8b5cf6">●</text>
        <text x="20" y="45">Sliding Window (滑动窗口)</text>
        <text x="0" y="65" fill="#22d3ee">●</text>
        <text x="20" y="65">Prefix Sum (前缀和)</text>
        <text x="0" y="85" fill="#fbbf24">●</text>
        <text x="20" y="85">Difference Array (差分数组)</text>
      </g>
    </g>

    <!-- Complexity badge -->
    <rect x="130" y="220" width="170" height="30" rx="15" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <text x="215" y="240" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">O(n) Solutions</text>
  </g>

  <!-- Two pointers demo -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="500" height="260" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="250" y="30" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Two Pointers Pattern</text>

    <!-- Array with pointers -->
    <g transform="translate(20, 60)">
      <g font-family="monospace" font-size="16" font-weight="bold">
        <rect x="0" y="0" width="45" height="40" rx="3" fill="#f43f5e"/>
        <text x="22" y="26" text-anchor="middle" fill="#fff">1</text>
        <rect x="50" y="0" width="45" height="40" rx="3" fill="#8b5cf6"/>
        <text x="72" y="26" text-anchor="middle" fill="#fff">2</text>
        <rect x="100" y="0" width="45" height="40" rx="3" fill="#22d3ee"/>
        <text x="122" y="26" text-anchor="middle" fill="#fff">3</text>
        <rect x="150" y="0" width="45" height="40" rx="3" fill="#fbbf24"/>
        <text x="172" y="26" text-anchor="middle" fill="#fff">4</text>
        <rect x="200" y="0" width="45" height="40" rx="3" fill="#f43f5e"/>
        <text x="222" y="26" text-anchor="middle" fill="#fff">5</text>
        <rect x="250" y="0" width="45" height="40" rx="3" fill="#8b5cf6"/>
        <text x="272" y="26" text-anchor="middle" fill="#fff">6</text>
        <rect x="300" y="0" width="45" height="40" rx="3" fill="#22d3ee"/>
        <text x="322" y="26" text-anchor="middle" fill="#fff">7</text>
        <rect x="350" y="0" width="45" height="40" rx="3" fill="#fbbf24"/>
        <text x="372" y="26" text-anchor="middle" fill="#fff">8</text>
      </g>

      <!-- Pointers -->
      <text x="22" y="-10" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">left</text>
      <line x1="22" y1="0" x2="22" y2="-5" stroke="#f43f5e" stroke-width="2"/>

      <text x="372" y="-10" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">right</text>
      <line x1="372" y1="0" x2="372" y2="-5" stroke="#22d3ee" stroke-width="2"/>

      <!-- Arrows -->
      <line x1="22" y1="40" x2="22" y2="55" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowR)"/>
      <line x1="372" y1="40" x2="372" y2="55" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowL)"/>
      <defs>
        <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#f43f5e"/>
        </marker>
        <marker id="arrowL" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
        </marker>
      </defs>
    </g>

    <!-- Template -->
    <g transform="translate(20, 150)">
      <text x="0" y="0" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Template:</text>
      <g font-family="monospace" font-size="11">
        <text x="0" y="25" fill="#8b5cf6">int</text>
        <text x="50" y="25" fill="#94a3b8">left = 0, right = n - 1;</text>
        <text x="0" y="45" fill="#8b5cf6">while</text>
        <text x="60" y="45" fill="#94a3b8">(left &lt; right) {</text>
        <text x="20" y="65" fill="#94a3b8">if (condition) left++;</text>
        <text x="20" y="85" fill="#94a3b8">else right--;</text>
        <text x="0" y="105" fill="#94a3b8">}</text>
      </g>
    </g>
  </g>

  <!-- Problem list -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="1000" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Classic Problems:</text>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="50" fill="#f43f5e" font-weight="bold">Two Sum:</text>
      <text x="110" y="50">Two Sum II (sorted)</text>
      <text x="270" y="50" fill="#64748b">|</text>
      <text x="290" y="50" fill="#8b5cf6" font-weight="bold">Container With Most Water</text>
      <text x="540" y="50" fill="#64748b">|</text>
      <text x="560" y="50" fill="#22d3ee" font-weight="bold">3Sum / 3Sum Closest</text>

      <text x="20" y="75" fill="#f43f5e" font-weight="bold">Sliding Window:</text>
      <text x="170" y="75">Minimum Size Subarray Sum</text>
      <text x="390" y="75" fill="#64748b">|</text>
      <text x="410" y="75" fill="#8b5cf6" font-weight="bold">Longest Substring Without Repeating</text>
      <text x="720" y="75" fill="#64748b">|</text>
      <text x="740" y="75" fill="#22d3ee" font-weight="bold">Permutation in String</text>

      <text x="20" y="100" fill="#f43f5e" font-weight="bold">Prefix/Diff:</text>
      <text x="140" y="100">Product of Array Except Self</text>
      <text x="360" y="100" fill="#64748b">|</text>
      <text x="380" y="100" fill="#8b5cf6" font-weight="bold">Range Sum Query</text>
      <text x="530" y="100" fill="#64748b">|</text>
      <text x="550" y="100" fill="#22d3ee" font-weight="bold">Bulb Switcher II</text>
      <text x="730" y="100" fill="#64748b">|</text>
      <text x="750" y="100" fill="#fbbf24" font-weight="bold">Merge Intervals</text>
    </g>
  </g>

  <!-- Tips -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Pro Tips:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="130" y="25" fill="#22d3ee">1. Sort first when order doesn't matter</text>
      <text x="380" y="25" fill="#64748b">|</text>
      <text x="400" y="25" fill="#8b5cf6">2. Use hash set for O(1) lookup</text>
      <text x="620" y="25" fill="#64748b">|</text>
      <text x="640" y="25" fill="#f43f5e">3. Prefix sum for range queries</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Master arrays → Master 40% of interview questions!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Array Tricks</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">秒杀数组技巧</text>
</svg>
