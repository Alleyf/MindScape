<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Meituan logo-inspired design -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="200" y="35" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Meituan Interview Prep</text>

    <!-- MT logo -->
    <g transform="translate(140, 60)">
      <rect x="0" y="0" width="120" height="60" rx="10" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="2"/>
      <text x="60" y="40" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">MT</text>
    </g>

    <!-- Topics -->
    <g transform="translate(30, 140)">
      <g font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
        <text x="0" y="0" fill="#f43f5e" font-weight="bold">Core Topics:</text>
        <text x="0" y="25" fill="#8b5cf6">●</text>
        <text x="20" y="25">Data Structures (树/图/哈希)</text>
        <text x="0" y="50" fill="#22d3ee">●</text>
        <text x="20" y="50">Algorithms (排序/搜索/DP)</text>
        <text x="0" y="75" fill="#fbbf24">●</text>
        <text x="20" y="75">System Design Basics</text>
        <text x="0" y="100" fill="#f43f5e">●</text>
        <text x="20" y="100">Coding Speed &amp; Accuracy</text>
      </g>
    </g>

    <!-- Focus areas -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="340" height="30" rx="15" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
      <text x="170" y="20" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">80% Focus on Arrays &amp; Trees</text>
    </g>
  </g>

  <!-- Problem distribution -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="550" height="280" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="275" y="35" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Question Distribution</text>

    <!-- Pie chart representation -->
    <g transform="translate(50, 70)">
      <!-- Background circle -->
      <circle cx="100" cy="100" r="80" fill="#1e293b" stroke="#334155" stroke-width="2"/>

      <!-- Segments (approximate) -->
      <!-- Arrays 35% -->
      <path d="M 100 100 L 100 20 A 80 80 0 0 1 175 70 Z" fill="#f43f5e" opacity="0.8"/>
      <!-- Trees 25% -->
      <path d="M 100 100 L 175 70 A 80 80 0 0 1 140 175 Z" fill="#8b5cf6" opacity="0.8"/>
      <!-- Strings 15% -->
      <path d="M 100 100 L 140 175 A 80 80 0 0 1 30 130 Z" fill="#22d3ee" opacity="0.8"/>
      <!-- DP 15% -->
      <path d="M 100 100 L 30 130 A 80 80 0 0 1 20 100 Z" fill="#fbbf24" opacity="0.8"/>
      <!-- Others 10% -->
      <path d="M 100 100 L 20 100 A 80 80 0 0 1 100 20 Z" fill="#64748b" opacity="0.8"/>

      <!-- Center text -->
      <text x="100" y="105" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">100%</text>
    </g>

    <!-- Legend -->
    <g transform="translate(260, 70)">
      <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#f43f5e"/>
        <text x="20" y="10">Arrays 35%</text>
        <rect x="0" y="25" width="12" height="12" rx="2" fill="#8b5cf6"/>
        <text x="20" y="35">Trees 25%</text>
        <rect x="0" y="50" width="12" height="12" rx="2" fill="#22d3ee"/>
        <text x="20" y="60">Strings 15%</text>
        <rect x="0" y="75" width="12" height="12" rx="2" fill="#fbbf24"/>
        <text x="20" y="85">DP 15%</text>
        <rect x="0" y="100" width="12" height="12" rx="2" fill="#64748b"/>
        <text x="20" y="110">Others 10%</text>
      </g>
    </g>

    <!-- Top problems -->
    <g transform="translate(20, 200)">
      <text x="0" y="0" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Most Frequent:</text>
      <g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
        <text x="0" y="25" fill="#f43f5e">1.</text>
        <text x="20" y="25">Two Sum variants</text>
        <text x="180" y="25" fill="#64748b">|</text>
        <text x="200" y="25" fill="#8b5cf6">2.</text>
        <text x="220" y="25">Binary Tree paths</text>
        <text x="380" y="25" fill="#64748b">|</text>
        <text x="400" y="25" fill="#22d3ee">3.</text>
        <text x="420" y="25">Merge intervals</text>

        <text x="0" y="50" fill="#f43f5e">4.</text>
        <text x="20" y="50">LRU Cache design</text>
        <text x="180" y="50" fill="#64748b">|</text>
        <text x="200" y="50" fill="#8b5cf6">5.</text>
        <text x="220" y="50">Top K elements</text>
        <text x="380" y="50" fill="#64748b">|</text>
        <text x="400" y="50" fill="#22d3ee">6.</text>
        <text x="420" y="50">Valid parentheses</text>
      </g>
    </g>
  </g>

  <!-- Preparation strategy -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Preparation Strategy:</text>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="50" fill="#f43f5e" font-weight="bold">Week 1-2:</text>
      <text x="110" y="50" fill="#22d3ee">Arrays + Two Pointers + Sliding Window (50+ problems)</text>
      <text x="20" y="75" fill="#f43f5e" font-weight="bold">Week 3-4:</text>
      <text x="110" y="75" fill="#8b5cf6">Trees + DFS/BFS + Recursion (40+ problems)</text>
      <text x="20" y="100" fill="#f43f5e" font-weight="bold">Week 5:</text>
      <text x="110" y="100" fill="#fbbf24">DP + Greedy + Mock Interviews (30+ problems)</text>
    </g>
  </g>

  <!-- Tips -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Interview Tips:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="150" y="25" fill="#22d3ee">1. Think aloud, explain your approach</text>
      <text x="400" y="25" fill="#64748b">|</text>
      <text x="420" y="25" fill="#8b5cf6">2. Write clean, bug-free code</text>
      <text x="620" y="25" fill="#64748b">|</text>
      <text x="640" y="25" fill="#f43f5e">3. Test edge cases before finishing</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Meituan values problem-solving speed + communication skills!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Meituan Interview</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">美团开发岗</text>
</svg>
