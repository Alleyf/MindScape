<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="dpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- DP Table - Knapsack style -->
  <g transform="translate(100, 80)">
    <text x="0" y="0" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Dynamic Programming Table</text>

    <!-- Table header -->
    <g font-family="monospace" font-size="14" fill="#94a3b8">
      <text x="30" y="30">i\w</text>
      <text x="70" y="30">0</text>
      <text x="110" y="30">1</text>
      <text x="150" y="30">2</text>
      <text x="190" y="30">3</text>
      <text x="230" y="30">4</text>
      <text x="270" y="30">5</text>
    </g>

    <!-- Table cells -->
    <g font-family="monospace" font-size="16" font-weight="bold">
      <!-- Row 0 -->
      <rect x="60" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="77" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="100" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="117" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="140" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="157" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="180" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="197" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="220" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="237" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="260" y="45" width="35" height="30" rx="3" fill="#334155"/>
      <text x="277" y="66" text-anchor="middle" fill="#94a3b8">0</text>
      <text x="30" y="66" fill="#64748b">0</text>

      <!-- Row 1 -->
      <rect x="60" y="80" width="35" height="30" rx="3" fill="#334155"/>
      <text x="77" y="101" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="100" y="80" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="117" y="101" text-anchor="middle" fill="#fff">3</text>
      <rect x="140" y="80" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="157" y="101" text-anchor="middle" fill="#fff">3</text>
      <rect x="180" y="80" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="197" y="101" text-anchor="middle" fill="#fff">3</text>
      <rect x="220" y="80" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="237" y="101" text-anchor="middle" fill="#fff">3</text>
      <rect x="260" y="80" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="277" y="101" text-anchor="middle" fill="#fff">3</text>
      <text x="30" y="101" fill="#8b5cf6">1</text>

      <!-- Row 2 -->
      <rect x="60" y="115" width="35" height="30" rx="3" fill="#334155"/>
      <text x="77" y="136" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="100" y="115" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="117" y="136" text-anchor="middle" fill="#fff">3</text>
      <rect x="140" y="115" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="157" y="136" text-anchor="middle" fill="#fff">4</text>
      <rect x="180" y="115" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="197" y="136" text-anchor="middle" fill="#fff">7</text>
      <rect x="220" y="115" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="237" y="136" text-anchor="middle" fill="#fff">7</text>
      <rect x="260" y="115" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="277" y="136" text-anchor="middle" fill="#fff">7</text>
      <text x="30" y="136" fill="#8b5cf6">2</text>

      <!-- Row 3 -->
      <rect x="60" y="150" width="35" height="30" rx="3" fill="#334155"/>
      <text x="77" y="171" text-anchor="middle" fill="#94a3b8">0</text>
      <rect x="100" y="150" width="35" height="30" rx="3" fill="#22d3ee" opacity="0.6"/>
      <text x="117" y="171" text-anchor="middle" fill="#fff">3</text>
      <rect x="140" y="150" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="157" y="171" text-anchor="middle" fill="#fff">4</text>
      <rect x="180" y="150" width="35" height="30" rx="3" fill="#f43f5e" opacity="0.8" filter="url(#glow)"/>
      <text x="197" y="171" text-anchor="middle" fill="#fff">7</text>
      <rect x="220" y="150" width="35" height="30" rx="3" fill="#8b5cf6" opacity="0.9" filter="url(#glow)"/>
      <text x="237" y="171" text-anchor="middle" fill="#fff">8</text>
      <rect x="260" y="150" width="35" height="30" rx="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
      <text x="277" y="171" text-anchor="middle" fill="#fff">10</text>
      <text x="30" y="171" fill="#8b5cf6">3</text>
    </g>

    <!-- Arrows showing dependency -->
    <g stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2" fill="none">
      <path d="M 157 80 L 157 70 L 117 70 L 117 66" marker-end="url(#arrowhead)"/>
      <path d="M 197 80 L 197 70 L 157 70 L 157 66" marker-end="url(#arrowhead)"/>
    </g>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#f43f5e"/>
      </marker>
    </defs>
  </g>

  <!-- State transition diagram -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="550" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="275" y="30" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">State Transition</text>

    <!-- States -->
    <circle cx="100" cy="100" r="35" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="100" y="107" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="14">dp[i-1]</text>

    <circle cx="275" cy="100" r="35" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>
    <text x="275" y="107" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="14">dp[i]</text>

    <circle cx="450" cy="100" r="35" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="450" y="107" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">dp[i+1]</text>

    <!-- Transition arrows -->
    <g stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowhead2)">
      <line x1="135" y1="100" x2="240" y2="100"/>
      <line x1="310" y1="100" x2="415" y2="100"/>
    </g>
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#f43f5e"/>
      </marker>
    </defs>

    <!-- Transition formula -->
    <text x="275" y="165" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">dp[i] = f(dp[i-1], choice)</text>
    <text x="275" y="185" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13">Overlapping Subproblems + Optimal Substructure</text>
  </g>

  <!-- Memoization pattern -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="1000" height="130" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="30" y="30" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Memoization Pattern</text>

    <g font-family="monospace" font-size="15" fill="#94a3b8">
      <text x="30" y="60">memo = {}</text>
      <text x="30" y="85">def dp(state):</text>
      <text x="50" y="110">if state in memo: return memo[state]</text>
      <text x="50" y="135">if base_case: return result</text>
    </g>

    <g font-family="monospace" font-size="15" fill="#f43f5e">
      <text x="300" y="60">result = choose_best(dp(next_state))</text>
      <text x="300" y="85">memo[state] = result</text>
      <text x="300" y="110">return result</text>
    </g>

    <text x="30" y="155" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14">Time: O(states × transitions) | Space: O(states)</text>
  </g>

  <!-- DP categories -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="1000" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      <text x="30" y="25" fill="#f43f5e" font-weight="bold">Linear DP:</text>
      <text x="150" y="25">House Robber</text>
      <text x="270" y="25" fill="#8b5cf6" font-weight="bold"> | Coin Change</text>
      <text x="410" y="25" fill="#22d3ee" font-weight="bold"> | Climbing Stairs</text>

      <text x="30" y="50" fill="#f43f5e" font-weight="bold">Interval DP:</text>
      <text x="140" y="50">Matrix Chain</text>
      <text x="250" y="50" fill="#8b5cf6" font-weight="bold"> | Burst Balloons</text>
      <text x="410" y="50" fill="#22d3ee" font-weight="bold"> | Longest Palindrome</text>

      <text x="600" y="25" fill="#fbbf24" font-weight="bold">2D DP:</text>
      <text x="680" y="25">Longest Common Subsequence</text>
      <text x="600" y="50" fill="#fbbf24" font-weight="bold"> | Knapsack</text>
      <text x="680" y="50">Edit Distance</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Dynamic Programming</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">动态规划解题技巧</text>
</svg>
