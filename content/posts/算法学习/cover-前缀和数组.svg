<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="prefixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Original array -->
  <g transform="translate(100, 100)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Original Array:</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="1000" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <g font-family="monospace" font-size="20" font-weight="bold">
        <rect x="10" y="5" width="55" height="40" rx="4" fill="#f43f5e" opacity="0.9"/>
        <text x="37" y="35" text-anchor="middle" fill="#fff">3</text>
        <rect x="75" y="5" width="55" height="40" rx="4" fill="#8b5cf6" opacity="0.9"/>
        <text x="102" y="35" text-anchor="middle" fill="#fff">1</text>
        <rect x="140" y="5" width="55" height="40" rx="4" fill="#22d3ee" opacity="0.9"/>
        <text x="167" y="35" text-anchor="middle" fill="#fff">4</text>
        <rect x="205" y="5" width="55" height="40" rx="4" fill="#fbbf24" opacity="0.9"/>
        <text x="232" y="35" text-anchor="middle" fill="#fff">2</text>
        <rect x="270" y="5" width="55" height="40" rx="4" fill="#f43f5e" opacity="0.9"/>
        <text x="297" y="35" text-anchor="middle" fill="#fff">5</text>
        <rect x="335" y="5" width="55" height="40" rx="4" fill="#8b5cf6" opacity="0.9"/>
        <text x="362" y="35" text-anchor="middle" fill="#fff">1</text>
        <rect x="400" y="5" width="55" height="40" rx="4" fill="#22d3ee" opacity="0.9"/>
        <text x="427" y="35" text-anchor="middle" fill="#fff">6</text>
        <rect x="465" y="5" width="55" height="40" rx="4" fill="#fbbf24" opacity="0.9"/>
        <text x="492" y="35" text-anchor="middle" fill="#fff">3</text>
        <rect x="530" y="5" width="55" height="40" rx="4" fill="#f43f5e" opacity="0.9"/>
        <text x="557" y="35" text-anchor="middle" fill="#fff">2</text>
      </g>
      <g font-family="monospace" font-size="12" fill="#64748b">
        <text x="37" y="62" text-anchor="middle">0</text>
        <text x="102" y="62" text-anchor="middle">1</text>
        <text x="167" y="62" text-anchor="middle">2</text>
        <text x="232" y="62" text-anchor="middle">3</text>
        <text x="297" y="62" text-anchor="middle">4</text>
        <text x="362" y="62" text-anchor="middle">5</text>
        <text x="427" y="62" text-anchor="middle">6</text>
        <text x="492" y="62" text-anchor="middle">7</text>
        <text x="557" y="62" text-anchor="middle">8</text>
      </g>
    </g>
  </g>

  <!-- Prefix sum array -->
  <g transform="translate(100, 230)">
    <text x="0" y="0" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16">Prefix Sum Array:</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="1000" height="50" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
      <g font-family="monospace" font-size="20" font-weight="bold">
        <rect x="10" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="37" y="35" text-anchor="middle" fill="#fff">3</text>
        <rect x="75" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="102" y="35" text-anchor="middle" fill="#fff">4</text>
        <rect x="140" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="167" y="35" text-anchor="middle" fill="#fff">8</text>
        <rect x="205" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="232" y="35" text-anchor="middle" fill="#fff">10</text>
        <rect x="270" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="297" y="35" text-anchor="middle" fill="#fff">15</text>
        <rect x="335" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="362" y="35" text-anchor="middle" fill="#fff">16</text>
        <rect x="400" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="427" y="35" text-anchor="middle" fill="#fff">22</text>
        <rect x="465" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="492" y="35" text-anchor="middle" fill="#fff">25</text>
        <rect x="530" y="5" width="55" height="40" rx="4" fill="url(#prefixGrad)"/>
        <text x="557" y="35" text-anchor="middle" fill="#fff">27</text>
      </g>
      <g font-family="monospace" font-size="12" fill="#64748b">
        <text x="37" y="62" text-anchor="middle">0</text>
        <text x="102" y="62" text-anchor="middle">1</text>
        <text x="167" y="62" text-anchor="middle">2</text>
        <text x="232" y="62" text-anchor="middle">3</text>
        <text x="297" y="62" text-anchor="middle">4</text>
        <text x="362" y="62" text-anchor="middle">5</text>
        <text x="427" y="62" text-anchor="middle">6</text>
        <text x="492" y="62" text-anchor="middle">7</text>
        <text x="557" y="62" text-anchor="middle">8</text>
      </g>
    </g>
  </g>

  <!-- Range sum query visualization -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="900" height="140" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="30" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Range Sum Query: sum[2, 6]</text>

    <!-- Highlighted range -->
    <g transform="translate(30, 50)">
      <rect x="140" y="0" width="260" height="40" rx="6" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
      <rect x="10" y="0" width="55" height="40" rx="4" fill="#f43f5e" opacity="0.6"/>
      <text x="37" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">3</text>
      <rect x="75" y="0" width="55" height="40" rx="4" fill="#8b5cf6" opacity="0.6"/>
      <text x="102" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">1</text>
      <rect x="140" y="0" width="55" height="40" rx="4" fill="#22d3ee"/>
      <text x="167" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">4</text>
      <rect x="205" y="0" width="55" height="40" rx="4" fill="#fbbf24"/>
      <text x="232" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">2</text>
      <rect x="270" y="0" width="55" height="40" rx="4" fill="#f43f5e"/>
      <text x="297" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">5</text>
      <rect x="335" y="0" width="55" height="40" rx="4" fill="#8b5cf6"/>
      <text x="362" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">1</text>
      <rect x="400" y="0" width="55" height="40" rx="4" fill="#22d3ee" opacity="0.6"/>
      <text x="427" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">6</text>
      <rect x="465" y="0" width="55" height="40" rx="4" fill="#fbbf24" opacity="0.6"/>
      <text x="492" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">3</text>
      <rect x="530" y="0" width="55" height="40" rx="4" fill="#f43f5e" opacity="0.6"/>
      <text x="557" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">2</text>
    </g>

    <!-- Formula -->
    <text x="30" y="110" fill="#22d3ee" font-family="monospace" font-size="20">sum[2,6] = prefix[6] - prefix[1] = 22 - 4 = 18</text>
  </g>

  <!-- Difference array comparison -->
  <g transform="translate(1050, 100)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="30" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Diff Array</text>
    <g transform="translate(20, 50)" font-family="monospace" font-size="14" fill="#94a3b8">
      <text x="0" y="0">diff[i] =</text>
      <text x="0" y="25">  arr[i] -</text>
      <text x="0" y="50">  arr[i-1]</text>
      <text x="0" y="85" fill="#22d3ee">O(1) update!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="550" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Prefix Sum Array</text>
  <text x="600" y="575" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">前缀和数组</text>
  <text x="600" y="605" text-anchor="middle" fill="#475569" font-family="monospace" font-size="14">O(1) Range Query | O(n) Preprocessing</text>
</svg>
