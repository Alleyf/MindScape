<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Monotonic stack visualization -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="200" y="30" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Monotonic Stack</text>

    <!-- Stack container -->
    <rect x="140" y="50" width="120" height="180" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>

    <!-- Stack elements (decreasing) -->
    <g transform="translate(150, 60)">
      <rect x="0" y="0" width="100" height="30" rx="4" fill="#f43f5e" opacity="0.9"/>
      <text x="50" y="20" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">7</text>

      <rect x="0" y="40" width="100" height="30" rx="4" fill="#8b5cf6" opacity="0.9"/>
      <text x="50" y="60" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">5</text>

      <rect x="0" y="80" width="100" height="30" rx="4" fill="#22d3ee" opacity="0.9"/>
      <text x="50" y="100" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">3</text>

      <rect x="0" y="120" width="100" height="30" rx="4" fill="#fbbf24" opacity="0.9"/>
      <text x="50" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">1</text>
    </g>

    <!-- Arrow showing next element -->
    <line x1="200" y1="240" x2="200" y2="260" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
      </marker>
    </defs>
    <text x="200" y="275" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">next: 4</text>

    <!-- Operation label -->
    <text x="200" y="295" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">while (stack.top() &gt;= next) stack.pop()</text>
  </g>

  <!-- Histogram application -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="550" height="280" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="275" y="30" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Largest Rectangle in Histogram</text>

    <!-- Histogram bars -->
    <g transform="translate(50, 60)">
      <rect x="0" y="60" width="40" height="60" fill="#f43f5e" opacity="0.8"/>
      <rect x="50" y="40" width="40" height="80" fill="#8b5cf6" opacity="0.8"/>
      <rect x="100" y="80" width="40" height="40" fill="#22d3ee" opacity="0.8"/>
      <rect x="150" y="20" width="40" height="100" fill="#fbbf24" opacity="0.8" filter="url(#glow)"/>
      <rect x="200" y="50" width="40" height="70" fill="#f43f5e" opacity="0.8"/>
      <rect x="250" y="70" width="40" height="50" fill="#8b5cf6" opacity="0.8"/>

      <!-- Highlighted rectangle -->
      <rect x="100" y="20" width="160" height="100" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,4"/>
      <text x="180" y="180" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="14">Area = 4 × 40 = 160</text>
    </g>

    <!-- Algorithm steps -->
    <g transform="translate(340, 160)">
      <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="13">1. Push indices to stack</text>
      <text x="0" y="25" fill="#94a3b8" font-family="monospace" font-size="13">2. When smaller element:</text>
      <text x="20" y="50" fill="#f43f5e" font-family="monospace" font-size="13">pop &amp; calculate area</text>
      <text x="0" y="75" fill="#94a3b8" font-family="monospace" font-size="13">3. Width = i - stack.top() - 1</text>
    </g>
  </g>

  <!-- Code template -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Monotonic Stack Template:</text>
    <g font-family="monospace" font-size="14">
      <text x="20" y="50" fill="#22d3ee">Stack&lt;Integer&gt;</text>
      <text x="180" y="50" fill="#94a3b8">stack = new Stack&lt;&gt;();</text>
      <text x="20" y="75" fill="#8b5cf6">for</text>
      <text x="90" y="75" fill="#94a3b8">(int i = 0; i &lt; nums.length; i++) {</text>
      <text x="40" y="100" fill="#f43f5e">while</text>
      <text x="100" y="100" fill="#94a3b8">(!stack.isEmpty() &amp;&amp; nums[stack.peek()] &gt;= nums[i]) {</text>
    </g>
  </g>

  <!-- Use cases -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
      <text x="20" y="25" fill="#f43f5e" font-weight="bold">Next Greater Element</text>
      <text x="200" y="25" fill="#64748b">|</text>
      <text x="220" y="25" fill="#8b5cf6" font-weight="bold">Trapping Rain Water</text>
      <text x="420" y="25" fill="#64748b">|</text>
      <text x="440" y="25" fill="#22d3ee" font-weight="bold">Daily Temperatures</text>
      <text x="640" y="25" fill="#64748b">|</text>
      <text x="660" y="25" fill="#fbbf24" font-weight="bold">Remove K Digits</text>
      <text x="840" y="25" fill="#64748b">|</text>
      <text x="860" y="25" fill="#f43f5e" font-weight="bold">Simplify Path</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Monotonic Stack</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">单调栈技巧</text>
</svg>
