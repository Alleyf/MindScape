<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="listGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Linked list visualization -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="450" height="260" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="225" y="30" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Linked List Structure</text>

    <!-- Nodes -->
    <g transform="translate(30, 60)">
      <!-- Node 1 -->
      <rect x="0" y="0" width="70" height="50" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
      <text x="35" y="22" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="bold">3</text>
      <line x1="70" y1="25" x2="100" y2="25" stroke="#f43f5e" stroke-width="2"/>
      <polygon points="100,20 110,25 100,30" fill="#f43f5e"/>

      <!-- Node 2 -->
      <rect x="110" y="0" width="70" height="50" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="145" y="22" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="14" font-weight="bold">1</text>
      <line x1="180" y1="25" x2="210" y2="25" stroke="#8b5cf6" stroke-width="2"/>
      <polygon points="210,20 220,25 210,30" fill="#8b5cf6"/>

      <!-- Node 3 -->
      <rect x="220" y="0" width="70" height="50" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="255" y="22" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">4</text>
      <line x1="290" y1="25" x2="320" y2="25" stroke="#22d3ee" stroke-width="2"/>
      <polygon points="320,20 330,25 320,30" fill="#22d3ee"/>

      <!-- Node 4 -->
      <rect x="330" y="0" width="70" height="50" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
      <text x="365" y="22" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">2</text>
      <line x1="400" y1="25" x2="420" y2="25" stroke="#64748b" stroke-width="2"/>
      <text x="425" y="30" fill="#64748b" font-family="monospace" font-size="14">null</text>
    </g>

    <!-- Node structure -->
    <g transform="translate(30, 140)">
      <text x="0" y="0" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Node Structure:</text>
      <g font-family="monospace" font-size="12">
        <text x="0" y="25" fill="#8b5cf6">class</text>
        <text x="50" y="25" fill="#f43f5e">ListNode</text>
        <text x="130" y="25" fill="#94a3b8">{</text>
        <text x="10" y="45" fill="#22d3ee">int</text>
        <text x="40" y="45" fill="#94a3b8">val;</text>
        <text x="10" y="65" fill="#22d3ee">ListNode</text>
        <text x="70" y="65" fill="#94a3b8">next;</text>
        <text x="130" y="25" fill="#94a3b8">}</text>
      </g>
    </g>

    <!-- Key operations -->
    <g transform="translate(30, 200)">
      <text x="0" y="0" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Key Operations:</text>
      <g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
        <text x="0" y="25" fill="#f43f5e">●</text>
        <text x="20" y="25">Reverse: O(n) time, O(1) space</text>
        <text x="0" y="45" fill="#8b5cf6">●</text>
        <text x="20" y="45">Detect Cycle: Floyd's algorithm</text>
        <text x="0" y="65" fill="#22d3ee">●</text>
        <text x="20" y="65">Merge: O(n+m) two sorted lists</text>
      </g>
    </g>
  </g>

  <!-- Reverse linked list -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="500" height="260" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="250" y="30" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Reverse Linked List</text>

    <!-- Before -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Before:</text>
      <g font-family="monospace" font-size="14" font-weight="bold">
        <rect x="0" y="10" width="40" height="30" rx="4" fill="#f43f5e"/>
        <text x="20" y="30" text-anchor="middle" fill="#fff">1</text>
        <line x1="40" y1="25" x2="60" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="60,20 70,25 60,30" fill="#64748b"/>
        <rect x="70" y="10" width="40" height="30" rx="4" fill="#8b5cf6"/>
        <text x="90" y="30" text-anchor="middle" fill="#fff">2</text>
        <line x1="110" y1="25" x2="130" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="130,20 140,25 130,30" fill="#64748b"/>
        <rect x="140" y="10" width="40" height="30" rx="4" fill="#22d3ee"/>
        <text x="160" y="30" text-anchor="middle" fill="#fff">3</text>
        <line x1="180" y1="25" x2="200" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="200,20 210,25 200,30" fill="#64748b"/>
        <text x="215" y="30" fill="#64748b">null</text>
      </g>
    </g>

    <!-- After -->
    <g transform="translate(20, 130)">
      <text x="0" y="0" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">After:</text>
      <g font-family="monospace" font-size="14" font-weight="bold">
        <text x="215" y="30" fill="#64748b">null</text>
        <line x1="200" y1="25" x2="180" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="180,20 170,25 180,30" fill="#64748b"/>
        <rect x="140" y="10" width="40" height="30" rx="4" fill="#22d3ee"/>
        <text x="160" y="30" text-anchor="middle" fill="#fff">3</text>
        <line x1="110" y1="25" x2="90" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="90,20 80,25 90,30" fill="#64748b"/>
        <rect x="70" y="10" width="40" height="30" rx="4" fill="#8b5cf6"/>
        <text x="90" y="30" text-anchor="middle" fill="#fff">2</text>
        <line x1="40" y1="25" x2="20" y2="25" stroke="#64748b" stroke-width="2"/>
        <polygon points="20,20 10,25 20,30" fill="#64748b"/>
        <rect x="0" y="10" width="40" height="30" rx="4" fill="#f43f5e"/>
        <text x="20" y="30" text-anchor="middle" fill="#fff">1</text>
      </g>
    </g>

    <!-- Iterative code -->
    <g transform="translate(250, 60)">
      <rect x="0" y="0" width="230" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="115" y="20" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Iterative</text>
      <g font-family="monospace" font-size="11">
        <text x="10" y="45" fill="#8b5cf6">ListNode</text>
        <text x="90" y="45" fill="#f43f5e">reverse</text>
        <text x="150" y="45" fill="#94a3b8">(ListNode head) {</text>
        <text x="20" y="65" fill="#22d3ee">ListNode</text>
        <text x="100" y="65" fill="#94a3b8">prev = null, curr = head;</text>
        <text x="20" y="85" fill="#8b5cf6">while</text>
        <text x="70" y="85" fill="#94a3b8">(curr != null) {</text>
        <text x="40" y="105" fill="#94a3b8">ListNode next = curr.next;</text>
        <text x="40" y="125" fill="#f43f5e">curr.next = prev;</text>
        <text x="40" y="145" fill="#94a3b8">prev = curr;</text>
        <text x="40" y="165" fill="#94a3b8">curr = next;</text>
        <text x="20" y="185" fill="#94a3b8">}</text>
        <text x="20" y="205" fill="#8b5cf6">return</text>
        <text x="80" y="205" fill="#94a3b8">prev;</text>
        <text x="10" y="225" fill="#94a3b8">}</text>
      </g>
    </g>
  </g>

  <!-- Common problems -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="1000" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Classic Problems:</text>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="50" fill="#f43f5e" font-weight="bold">Reverse:</text>
      <text x="100" y="50">Reverse Linked List</text>
      <text x="250" y="50" fill="#64748b">|</text>
      <text x="270" y="50" fill="#8b5cf6" font-weight="bold">Reverse II (range)</text>
      <text x="430" y="50" fill="#64748b">|</text>
      <text x="450" y="50" fill="#22d3ee" font-weight="bold">Reverse in groups of K</text>

      <text x="20" y="75" fill="#f43f5e" font-weight="bold">Cycle:</text>
      <text x="90" y="75">Linked List Cycle I/II</text>
      <text x="260" y="75" fill="#64748b">|</text>
      <text x="280" y="75" fill="#8b5cf6" font-weight="bold">Happy Number</text>
      <text x="410" y="75" fill="#64748b">|</text>
      <text x="430" y="75" fill="#22d3ee" font-weight="bold">Find Duplicate Number</text>

      <text x="20" y="100" fill="#f43f5e" font-weight="bold">Merge:</text>
      <text x="90" y="100">Merge Two Sorted Lists</text>
      <text x="270" y="100" fill="#64748b">|</text>
      <text x="290" y="100" fill="#8b5cf6" font-weight="bold">Merge K Sorted Lists</text>
      <text x="490" y="100" fill="#64748b">|</text>
      <text x="510" y="100" fill="#22d3ee" font-weight="bold">Sort List (merge sort)</text>
      <text x="700" y="100" fill="#64748b">|</text>
      <text x="720" y="100" fill="#fbbf24" font-weight="bold">Reorder List</text>
    </g>
  </g>

  <!-- Tips -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Pro Tips:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="130" y="25" fill="#22d3ee">1. Use dummy head for edge cases</text>
      <text x="380" y="25" fill="#64748b">|</text>
      <text x="400" y="25" fill="#8b5cf6">2. Fast/slow pointers for cycle</text>
      <text x="620" y="25" fill="#64748b">|</text>
      <text x="640" y="25" fill="#f43f5e">3. Recursion for elegant reversals</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Linked List problems test pointer manipulation mastery!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Linked List Tricks</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">秒杀链表技巧</text>
</svg>
