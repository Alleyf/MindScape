<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="600" y1="0" x2="600" y2="630"/>
    <circle cx="600" cy="315" r="150" fill="none"/><circle cx="600" cy="315" r="250" fill="none"/><circle cx="600" cy="315" r="350" fill="none"/>
  </g>
  <g transform="translate(600, 280)">
    <g stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5">
      <line x1="0" y1="-60" x2="-120" y2="20"/><line x1="0" y1="-60" x2="120" y2="20"/>
      <line x1="-120" y1="20" x2="-180" y2="100"/><line x1="-120" y1="20" x2="-60" y2="100"/>
      <line x1="120" y1="20" x2="60" y2="100"/><line x1="120" y1="20" x2="180" y2="100"/>
    </g>
    <g transform="translate(0, -60)">
      <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#8b5cf6"/>
      <text x="0" y="5" fill="#fff" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">5</text>
      <text x="0" y="50" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">"five"</text>
    </g>
    <g transform="translate(-120, 20)">
      <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#a855f7" fill-opacity="0.8"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">2</text>
      <text x="0" y="48" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">"two"</text>
    </g>
    <g transform="translate(120, 20)">
      <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#a855f7" fill-opacity="0.8"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">8</text>
      <text x="0" y="48" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">"eight"</text>
    </g>
    <g transform="translate(-180, 100)">
      <rect x="-25" y="-15" width="50" height="30" rx="5" fill="#c084fc" fill-opacity="0.7"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">1</text>
    </g>
    <g transform="translate(-60, 100)">
      <rect x="-25" y="-15" width="50" height="30" rx="5" fill="#c084fc" fill-opacity="0.7"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">3</text>
    </g>
    <g transform="translate(60, 100)">
      <rect x="-25" y="-15" width="50" height="30" rx="5" fill="#c084fc" fill-opacity="0.7"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">7</text>
    </g>
    <g transform="translate(180, 100)">
      <rect x="-25" y="-15" width="50" height="30" rx="5" fill="#c084fc" fill-opacity="0.7"/>
      <text x="0" y="3" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">9</text>
    </g>
  </g>
  <g transform="translate(100, 150)" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="14">
    <text x="0" y="0" fill-opacity="0.8">left child {'<'} parent</text>
    <text x="0" y="25" fill-opacity="0.8">right child {'>'} parent</text>
    <text x="0" y="50" fill-opacity="0.8">O(log n) average</text>
  </g>
  <g transform="translate(850, 120)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="15" y="25" fill="#06b6d4" font-family="monospace" font-size="12">put(key, value) {'{'}</text>
    <text x="25" y="50" fill="#a855f7" font-family="monospace" font-size="11">if (cmp {'<'} 0)</text>
    <text x="35" y="70" fill="#c084fc" font-family="monospace" font-size="11">cur = cur.left</text>
    <text x="25" y="95" fill="#a855f7" font-family="monospace" font-size="11">else if (cmp {'>'} 0)</text>
    <text x="35" y="115" fill="#c084fc" font-family="monospace" font-size="11">cur = cur.right</text>
    <text x="25" y="140" fill="#a855f7" font-family="monospace" font-size="11">else</text>
    <text x="35" y="160" fill="#c084fc" font-family="monospace" font-size="11">cur.value = value</text>
    <text x="15" y="180" fill="#06b6d4" font-family="monospace" font-size="12">{'}'}</text>
  </g>
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="100" y="30" fill="#06b6d4" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">TreeSet</text>
    <text x="100" y="55" fill="#ffffff" fill-opacity="0.6" font-family="monospace" font-size="12" text-anchor="middle">MyTreeMap&lt;E, Object&gt;</text>
  </g>
  <text x="600" y="520" fill="url(#grad2)" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle">TreeMap 与 TreeSet</text>
  <text x="600" y="565" fill="#ffffff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Binary Search Tree Implementation</text>
  <rect x="480" y="590" width="240" height="3" fill="url(#grad2)" rx="1.5"/>
</svg>
