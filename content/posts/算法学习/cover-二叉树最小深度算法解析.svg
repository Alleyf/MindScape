<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Tree with depth highlighting -->
  <g transform="translate(200, 60)">
    <!-- Root -->
    <circle cx="200" cy="0" r="30" fill="#1e293b" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/>
    <text x="200" y="8" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="20" font-weight="bold">1</text>

    <!-- Level 1 -->
    <circle cx="100" cy="80" r="26" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="100" y="87" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16">2</text>
    <circle cx="300" cy="80" r="26" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="300" y="87" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16">3</text>

    <!-- Level 2 -->
    <circle cx="50" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="50" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">4</text>
    <circle cx="150" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="150" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">5</text>
    <circle cx="250" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="250" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">6</text>
    <circle cx="350" cy="160" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="350" y="167" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14">7</text>

    <!-- Level 3 (leaf) -->
    <circle cx="30" cy="240" r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="30" y="246" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12">8</text>

    <!-- Connecting lines -->
    <g stroke="#475569" stroke-width="2">
      <line x1="200" y1="30" x2="100" y2="54"/>
      <line x1="200" y1="30" x2="300" y2="54"/>
      <line x1="100" y1="106" x2="50" y2="138"/>
      <line x1="100" y1="106" x2="150" y2="138"/>
      <line x1="300" y1="106" x2="250" y2="138"/>
      <line x1="300" y1="106" x2="350" y2="138"/>
      <line x1="50" y1="182" x2="30" y2="222"/>
    </g>

    <!-- Depth annotation -->
    <line x1="380" y1="0" x2="380" y2="240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="395" y="120" fill="#f43f5e" font-family="monospace" font-size="14">depth=3</text>
  </g>

  <!-- BFS visualization -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="450" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="225" y="35" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">BFS Queue</text>

    <!-- Queue visualization -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="60" height="40" rx="6" fill="#f43f5e" opacity="0.8"/>
      <text x="30" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">1</text>
      <rect x="70" y="0" width="60" height="40" rx="6" fill="#8b5cf6" opacity="0.8"/>
      <text x="100" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">2</text>
      <rect x="140" y="0" width="60" height="40" rx="6" fill="#8b5cf6" opacity="0.8"/>
      <text x="170" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">3</text>
      <rect x="210" y="0" width="60" height="40" rx="6" fill="#22d3ee" opacity="0.8"/>
      <text x="240" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">4</text>
      <rect x="280" y="0" width="60" height="40" rx="6" fill="#22d3ee" opacity="0.8"/>
      <text x="310" y="27" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">5</text>
    </g>

    <text x="225" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">queue.push(root)</text>
    <text x="225" y="170" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">while (!queue.empty())</text>
    <text x="225" y="200" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">  node = queue.pop()</text>
    <text x="225" y="230" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">  queue.push(node.children)</text>
  </g>

  <!-- Formula -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="1000" height="120" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="30" y="35" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Minimum Depth Formula:</text>
    <text x="30" y="65" fill="#94a3b8" font-family="monospace" font-size="18">minDepth(root) = </text>
    <text x="280" y="65" fill="#22d3ee" font-family="monospace" font-size="18">1 + min(minDepth(left), minDepth(right))</text>
    <text x="30" y="95" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">Handle leaf nodes carefully — single child doesn't count as leaf!</text>
  </g>

  <!-- Result highlight -->
  <g transform="translate(850, 380)">
    <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
    <text x="60" y="55" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">Min</text>
    <text x="60" y="75" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="24" font-weight="bold">3</text>
  </g>

  <!-- Title -->
  <text x="600" y="550" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Min Depth of Binary Tree</text>
  <text x="600" y="575" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">二叉树最小深度算法解析</text>
  <text x="600" y="605" text-anchor="middle" fill="#475569" font-family="monospace" font-size="14">BFS / DFS Approach</text>
</svg>
