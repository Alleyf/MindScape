<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Huawei logo-inspired hexagon -->
  <g transform="translate(100, 80)">
    <polygon points="120,10 220,60 220,160 120,210 20,160 20,60" fill="#1e293b" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/>
    <text x="120" y="115" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">H</text>
    <text x="120" y="180" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Huawei</text>
  </g>

  <!-- Algorithm topics grid -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="750" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="375" y="35" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Must-Know Interview Algorithms</text>

    <!-- Topic cards -->
    <g transform="translate(20, 55)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="220" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="110" y="28" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Two Pointers</text>
      <text x="110" y="50" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">快慢指针 / 对撞指针</text>

      <!-- Card 2 -->
      <rect x="240" y="0" width="220" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="350" y="28" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Binary Search</text>
      <text x="350" y="50" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">二分查找 / 搜索空间</text>

      <!-- Card 3 -->
      <rect x="480" y="0" width="220" height="70" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
      <text x="590" y="28" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Sliding Window</text>
      <text x="590" y="50" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">滑动窗口 / 双端队列</text>

      <!-- Card 4 -->
      <rect x="0" y="90" width="220" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="110" y="118" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Linked List</text>
      <text x="110" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">反转 / 环检测 / 合并</text>

      <!-- Card 5 -->
      <rect x="240" y="90" width="220" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="350" y="118" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Stack &amp; Queue</text>
      <text x="350" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">单调栈 / 括号匹配</text>

      <!-- Card 6 -->
      <rect x="480" y="90" width="220" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="590" y="118" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Tree Traversal</text>
      <text x="590" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">DFS / BFS / 递归</text>

      <!-- Card 7 -->
      <rect x="0" y="180" width="220" height="70" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
      <text x="110" y="208" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Dynamic Prog</text>
      <text x="110" y="230" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">状态转移 / 记忆化</text>

      <!-- Card 8 -->
      <rect x="240" y="180" width="220" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="350" y="208" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Backtracking</text>
      <text x="350" y="230" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">回溯 / 剪枝 / 排列组合</text>

      <!-- Card 9 -->
      <rect x="480" y="180" width="220" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="590" y="208" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">String Algo</text>
      <text x="590" y="230" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">KMP / 字符串匹配</text>
    </g>
  </g>

  <!-- Code snippet -->
  <g transform="translate(350, 390)">
    <rect x="0" y="0" width="750" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">// Two Pointer Template</text>
    <g font-family="monospace" font-size="14">
      <text x="20" y="50" fill="#f43f5e">int</text>
      <text x="70" y="50" fill="#94a3b8">twoSum(int[] nums, int target) {</text>
      <text x="40" y="75" fill="#22d3ee">int</text>
      <text x="80" y="75" fill="#94a3b8">left = 0, right = nums.length - 1;</text>
      <text x="40" y="100" fill="#8b5cf6">while</text>
      <text x="110" y="100" fill="#94a3b8">(left &lt; right) {</text>
      <text x="60" y="100" fill="#64748b">...</text>
    </g>
  </g>

  <!-- Difficulty badges -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="220" height="60" rx="30" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="2"/>
    <text x="110" y="35" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Hard</text>

    <rect x="250" y="0" width="220" height="60" rx="30" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="2"/>
    <text x="360" y="35" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Medium</text>

    <rect x="500" y="0" width="220" height="60" rx="30" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
    <text x="610" y="35" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Easy</text>
  </g>

  <!-- Frequency chart -->
  <g transform="translate(750, 450)">
    <rect x="0" y="0" width="300" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="150" y="25" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Top 5 Most Asked</text>
    <g font-family="monospace" font-size="11" fill="#22d3ee">
      <text x="10" y="45">1. Two Sum</text>
      <text x="100" y="45" fill="#fbbf24">99%</text>
      <text x="150" y="45">2. Reverse LL</text>
      <text x="240" y="45" fill="#fbbf24">95%</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Huawei Interview Algorithms</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">华为手撕必考</text>
</svg>
