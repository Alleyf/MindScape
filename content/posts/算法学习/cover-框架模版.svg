<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="frameworkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Framework diagram -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="200" y="25" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Algorithm Framework</text>

    <!-- Main framework box -->
    <rect x="30" y="50" width="340" height="220" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Framework steps -->
    <g font-family="monospace" font-size="13">
      <text x="50" y="80" fill="#22d3ee">// 1. Define the state</text>
      <text x="50" y="105" fill="#94a3b8">state = f(parameters)</text>

      <text x="50" y="135" fill="#22d3ee">// 2. Base case</text>
      <text x="50" y="160" fill="#8b5cf6">if</text>
      <text x="90" y="160" fill="#94a3b8">(终止条件) return base_result;</text>

      <text x="50" y="190" fill="#22d3ee">// 3. State transition</text>
      <text x="50" y="215" fill="#f43f5e">for</text>
      <text x="80" y="215" fill="#94a3b8">(choice : choices) {</text>
      <text x="70" y="240" fill="#94a3b8">state = transition(state, choice);</text>
      <text x="70" y="265" fill="#94a3b8">result = combine(result, dfs(state));</text>
      <text x="50" y="290" fill="#94a3b8">}</text>
    </g>

    <!-- Arrow -->
    <line x1="200" y1="270" x2="200" y2="290" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
      </marker>
    </defs>
    <text x="200" y="305" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12">Return result</text>
  </g>

  <!-- Common patterns -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="550" height="300" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="275" y="25" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Common Patterns</text>

    <!-- Pattern cards -->
    <g transform="translate(20, 50)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="250" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="125" y="25" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Divide &amp; Conquer</text>
      <text x="125" y="48" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">solve(left) + solve(right)</text>
      <text x="125" y="65" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Merge step combines results</text>

      <!-- Card 2 -->
      <rect x="270" y="0" width="250" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="395" y="25" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Dynamic Programming</text>
      <text x="395" y="48" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">dp[i] = f(dp[i-1], ...)</text>
      <text x="395" y="65" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Overlapping subproblems</text>

      <!-- Card 3 -->
      <rect x="0" y="90" width="250" height="70" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
      <text x="125" y="115" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Two Pointers</text>
      <text x="125" y="138" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">left = 0, right = n-1</text>
      <text x="125" y="155" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Move based on condition</text>

      <!-- Card 4 -->
      <rect x="270" y="0" width="250" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="395" y="25" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sliding Window</text>
      <text x="395" y="48" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">expand right, shrink left</text>
      <text x="395" y="65" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Maintain valid window</text>

      <!-- Card 5 -->
      <rect x="0" y="180" width="250" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="125" y="205" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Binary Search</text>
      <text x="125" y="228" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">while (left &lt;= right)</text>
      <text x="125" y="245" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">narrow search space</text>

      <!-- Card 6 -->
      <rect x="270" y="180" width="250" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="395" y="205" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Backtracking</text>
      <text x="395" y="228" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">try → recurse → undo</text>
      <text x="395" y="245" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Explore all possibilities</text>
    </g>
  </g>

  <!-- Template code -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Universal DFS Template:</text>
    <g font-family="monospace" font-size="13">
      <text x="20" y="50" fill="#8b5cf6">def</text>
      <text x="70" y="50" fill="#f43f5e">dfs</text>
      <text x="120" y="50" fill="#94a3b8">(state):</text>
      <text x="40" y="75" fill="#22d3ee"># base case</text>
      <text x="40" y="100" fill="#8b5cf6">if</text>
      <text x="80" y="100" fill="#94a3b8">is_end(state): return solve(state)</text>
      <text x="40" y="125" fill="#22d3ee"># memoization</text>
      <text x="40" y="150" fill="#8b5cf6">if</text>
      <text x="80" y="150" fill="#94a3b8">state in memo: return memo[state]</text>
      <text x="40" y="175" fill="#22d3ee"># explore</text>
      <text x="40" y="200" fill="#8b5cf6">for</text>
      <text x="80" y="200" fill="#94a3b8">choice in get_choices(state):</text>
      <text x="60" y="225" fill="#f43f5e">if</text>
      <text x="100" y="225" fill="#94a3b8">is_valid(choice):</text>
      <text x="80" y="250" fill="#94a3b8">res = min/res dfs(new_state)</text>
      <text x="40" y="275" fill="#8b5cf6">return</text>
      <text x="90" y="275" fill="#94a3b8">memo[state] = res</text>
    </g>
  </g>

  <!-- Key insights -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Key Insights:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="150" y="25" fill="#22d3ee">1. Identify state representation</text>
      <text x="380" y="25" fill="#64748b">|</text>
      <text x="400" y="25" fill="#8b5cf6">2. Find base cases</text>
      <text x="540" y="25" fill="#64748b">|</text>
      <text x="560" y="25" fill="#f43f5e">3. Write transition equation</text>
      <text x="780" y="25" fill="#64748b">|</text>
      <text x="800" y="25" fill="#fbbf24">4. Add memoization</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Master these patterns → Solve 80% of algorithm problems!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Algorithm Framework</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">框架模版</text>
</svg>
