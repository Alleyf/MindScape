<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="frameworkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Main framework diagram -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="200" y="25" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Universal Algorithm Template</text>

    <!-- Main box -->
    <rect x="30" y="50" width="340" height="220" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>

    <g font-family="monospace" font-size="13">
      <text x="50" y="80" fill="#22d3ee">// Step 1: Define state</text>
      <text x="50" y="105" fill="#94a3b8">state = function(parameters)</text>

      <text x="50" y="135" fill="#22d3ee">// Step 2: Base case</text>
      <text x="50" y="160" fill="#8b5cf6">if</text>
      <text x="90" y="160" fill="#94a3b8">(终止条件) return base;</text>

      <text x="50" y="190" fill="#22d3ee">// Step 3: State transition</text>
      <text x="50" y="215" fill="#f43f5e">for</text>
      <text x="80" y="215" fill="#94a3b8">(choice : choices) {</text>
      <text x="70" y="240" fill="#94a3b8">make choice;</text>
      <text x="70" y="265" fill="#94a3b8">result = dfs(new_state);</text>
      <text x="70" y="290" fill="#94a3b8">undo choice;</text>
      <text x="50" y="315" fill="#94a3b8">}</text>
      <text x="50" y="340" fill="#8b5cf6">return</text>
      <text x="100" y="340" fill="#94a3b8">best(result);</text>
    </g>
  </g>

  <!-- Pattern comparison -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="550" height="300" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="275" y="25" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Pattern Comparison</text>

    <!-- Table -->
    <g transform="translate(20, 50)">
      <!-- Header -->
      <rect x="0" y="0" width="510" height="30" rx="4" fill="#334155"/>
      <text x="10" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Pattern</text>
      <text x="150" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">When to Use</text>
      <text x="300" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Time</text>
      <text x="420" y="20" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Space</text>

      <!-- Row 1 -->
      <rect x="0" y="30" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="47" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11">DFS/Backtracking</text>
      <text x="150" y="47" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">All solutions</text>
      <text x="300" y="47" fill="#22d3ee" font-family="monospace" font-size="11">O(k^n)</text>
      <text x="420" y="47" fill="#22d3ee" font-family="monospace" font-size="11">O(n)</text>

      <!-- Row 2 -->
      <rect x="0" y="55" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="72" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11">Dynamic Prog</text>
      <text x="150" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Optimal substructure</text>
      <text x="300" y="72" fill="#22d3ee" font-family="monospace" font-size="11">O(n²)</text>
      <text x="420" y="72" fill="#22d3ee" font-family="monospace" font-size="11">O(n)</text>

      <!-- Row 3 -->
      <rect x="0" y="80" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="97" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11">Two Pointers</text>
      <text x="150" y="97" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sorted arrays</text>
      <text x="300" y="97" fill="#22d3ee" font-family="monospace" font-size="11">O(n)</text>
      <text x="420" y="97" fill="#22d3ee" font-family="monospace" font-size="11">O(1)</text>

      <!-- Row 4 -->
      <rect x="0" y="105" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="122" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Binary Search</text>
      <text x="150" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sorted + monotonic</text>
      <text x="300" y="122" fill="#22d3ee" font-family="monospace" font-size="11">O(log n)</text>
      <text x="420" y="122" fill="#22d3ee" font-family="monospace" font-size="11">O(1)</text>

      <!-- Row 5 -->
      <rect x="0" y="130" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="147" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11">Sliding Window</text>
      <text x="150" y="147" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Subarray problems</text>
      <text x="300" y="147" fill="#22d3ee" font-family="monospace" font-size="11">O(n)</text>
      <text x="420" y="147" fill="#22d3ee" font-family="monospace" font-size="11">O(1)</text>

      <!-- Row 6 -->
      <rect x="0" y="155" width="510" height="25" rx="4" fill="#1e293b"/>
      <text x="10" y="172" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11">BFS</text>
      <text x="150" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Shortest path</text>
      <text x="300" y="172" fill="#22d3ee" font-family="monospace" font-size="11">O(V+E)</text>
      <text x="420" y="172" fill="#22d3ee" font-family="monospace" font-size="11">O(V)</text>
    </g>
  </g>

  <!-- Decision tree -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">How to Choose:</text>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="50" fill="#f43f5e" font-weight="bold">1. Is data sorted?</text>
      <text x="170" y="50" fill="#22d3ee">Yes → Binary Search / Two Pointers</text>
      <text x="20" y="75" fill="#f43f5e" font-weight="bold">2. Need all combinations?</text>
      <text x="200" y="75" fill="#8b5cf6">Yes → Backtracking</text>
      <text x="20" y="100" fill="#f43f5e" font-weight="bold">3. Overlapping subproblems?</text>
      <text x="230" y="100" fill="#fbbf24">Yes → Dynamic Programming</text>
    </g>
  </g>

  <!-- Key principles -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Core Principles:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="150" y="25" fill="#22d3ee">1. Break down into subproblems</text>
      <text x="380" y="25" fill="#64748b">|</text>
      <text x="400" y="25" fill="#8b5cf6">2. Identify optimal substructure</text>
      <text x="620" y="25" fill="#64748b">|</text>
      <text x="640" y="25" fill="#f43f5e">3. Memoize repeated calculations</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Template mastery → Faster problem solving → Better interviews!</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Algorithm Template</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">算法框架模板</text>
</svg>
