<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Backtracking tree -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="200" y="25" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Backtracking Tree</text>

    <!-- Tree nodes -->
    <circle cx="200" cy="55" r="20" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <text x="200" y="62" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="12">[]</text>

    <!-- Level 1 -->
    <circle cx="130" cy="120" r="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="130" y="126" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">[1]</text>
    <circle cx="270" cy="120" r="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="270" y="126" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">[2]</text>
    <circle cx="350" cy="120" r="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="350" y="126" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">[3]</text>

    <!-- Level 2 -->
    <circle cx="90" cy="190" r="15" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="90" y="195" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">[1,2]</text>
    <circle cx="170" cy="190" r="15" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="170" y="195" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">[1,3]</text>
    <circle cx="230" cy="190" r="15" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="230" y="195" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">[2,1]</text>
    <circle cx="310" cy="190" r="15" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="310" y="195" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">[2,3]</text>
    <circle cx="370" cy="190" r="15" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="370" y="195" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">[3,1]</text>

    <!-- Level 3 (solutions) -->
    <circle cx="70" cy="260" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="70" y="264" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">[1,2,3]</text>
    <circle cx="110" cy="260" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="110" y="264" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">[1,3,2]</text>
    <circle cx="210" cy="260" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="210" y="264" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">[2,1,3]</text>
    <circle cx="290" cy="260" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="290" y="264" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">[2,3,1]</text>
    <circle cx="350" cy="260" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/>
    <text x="350" y="264" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">[3,1,2]</text>

    <!-- Connecting lines -->
    <g stroke="#475569" stroke-width="1.5">
      <line x1="200" y1="75" x2="130" y2="102"/>
      <line x1="200" y1="75" x2="270" y2="102"/>
      <line x1="200" y1="75" x2="350" y2="102"/>
      <line x1="130" y1="138" x2="90" y2="175"/>
      <line x1="130" y1="138" x2="170" y2="175"/>
      <line x1="270" y1="138" x2="230" y2="175"/>
      <line x1="270" y1="138" x2="310" y2="175"/>
      <line x1="350" y1="138" x2="370" y2="175"/>
      <line x1="90" y1="205" x2="70" y2="248"/>
      <line x1="90" y1="205" x2="110" y2="248"/>
      <line x1="230" y1="205" x2="210" y2="248"/>
      <line x1="310" y1="205" x2="290" y2="248"/>
      <line x1="370" y1="205" x2="350" y2="248"/>
    </g>

    <!-- Pruning indicator -->
    <line x1="390" y1="190" x2="410" y2="190" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="415" y="195" fill="#f43f5e" font-family="monospace" font-size="10">pruned</text>
  </g>

  <!-- Backtracking template -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="550" height="300" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="275" y="25" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Backtracking Template</text>

    <g font-family="monospace" font-size="13">
      <text x="20" y="55" fill="#8b5cf6">void</text>
      <text x="80" y="55" fill="#f43f5e">backtrack</text>
      <text x="180" y="55" fill="#94a3b8">(path, choices) {</text>
      <text x="40" y="80" fill="#22d3ee">// base case</text>
      <text x="40" y="105" fill="#8b5cf6">if</text>
      <text x="90" y="105" fill="#94a3b8">(满足结束条件) {</text>
      <text x="60" y="130" fill="#fbbf24">result.add(new path);</text>
      <text x="40" y="155" fill="#94a3b8">return;</text>
      <text x="40" y="180" fill="#94a3b8">}</text>

      <text x="40" y="205" fill="#22d3ee">// try each choice</text>
      <text x="40" y="230" fill="#8b5cf6">for</text>
      <text x="80" y="230" fill="#94a3b8">(choice : choices) {</text>
      <text x="60" y="255" fill="#f43f5e">if</text>
      <text x="100" y="255" fill="#94a3b8">(剪枝条件) continue;</text>
      <text x="60" y="280" fill="#94a3b8">make choice;</text>
      <text x="60" y="305" fill="#94a3b8">backtrack(...);</text>
      <text x="60" y="330" fill="#94a3b8">undo choice;</text>
      <text x="40" y="355" fill="#94a3b8">}</text>
      <text x="20" y="380" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- Problem categories -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Problem Categories:</text>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="50" fill="#8b5cf6" font-weight="bold">Permutations:</text>
      <text x="140" y="50">Permutations I/II</text>
      <text x="290" y="50" fill="#64748b">|</text>
      <text x="310" y="50" fill="#22d3ee" font-weight="bold">Combinations:</text>
      <text x="440" y="50">Combination Sum</text>
      <text x="560" y="50" fill="#64748b">|</text>
      <text x="580" y="50" fill="#fbbf24" font-weight="bold">Subsets:</text>
      <text x="660" y="50">Subsets I/II</text>

      <text x="20" y="75" fill="#8b5cf6" font-weight="bold">N-Queens:</text>
      <text x="110" y="75">N-Queens I/II</text>
      <text x="220" y="75" fill="#64748b">|</text>
      <text x="240" y="75" fill="#22d3ee" font-weight="bold">Sudoku:</text>
      <text x="320" y="75">Sudoku Solver</text>
      <text x="450" y="75" fill="#64748b">|</text>
      <text x="470" y="75" fill="#fbbf24" font-weight="bold">Palindrome:</text>
      <text x="570" y="75">Palindrome Partitioning</text>
      <text x="760" y="75" fill="#64748b">|</text>
      <text x="780" y="75" fill="#f43f5e" font-weight="bold">Word Search</text>
    </g>
  </g>

  <!-- Pruning tips -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1000" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Pruning Tips:</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      <text x="140" y="25" fill="#22d3ee">1. Sort + skip duplicates</text>
      <text x="340" y="25" fill="#64748b">|</text>
      <text x="360" y="25" fill="#8b5cf6">2. Early termination when impossible</text>
      <text x="620" y="25" fill="#64748b">|</text>
      <text x="640" y="25" fill="#f43f5e">3. Use visited set to avoid reuse</text>
      <text x="20" y="45" fill="#fbbf24" font-weight="bold">Time: O(k^n) where k = choices, n = depth</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Backtracking</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">回溯解题技巧</text>
</svg>
