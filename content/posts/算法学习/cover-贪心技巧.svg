<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greedyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Greedy concept -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="450" height="260" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="225" y="30" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Greedy Algorithm</text>

    <!-- Concept visualization -->
    <g transform="translate(30, 60)">
      <!-- Path visualization -->
      <line x1="20" y1="100" x2="380" y2="100" stroke="#334155" stroke-width="2"/>

      <!-- Points -->
      <circle cx="20" cy="100" r="8" fill="#f43f5e"/>
      <circle cx="100" cy="70" r="8" fill="#8b5cf6"/>
      <circle cx="180" cy="120" r="8" fill="#22d3ee"/>
      <circle cx="260" cy="80" r="8" fill="#fbbf24"/>
      <circle cx="340" cy="110" r="8" fill="#f43f5e"/>
      <circle cx="380" cy="100" r="8" fill="#22d3ee" filter="url(#glow)"/>

      <!-- Greedy path (choosing local optimum) -->
      <path d="M 20 100 L 100 70 L 180 120 L 260 80 L 340 110 L 380 100" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,3"/>

      <!-- Optimal path -->
      <path d="M 20 100 L 180 120 L 380 100" fill="none" stroke="#22d3ee" stroke-width="3"/>

      <!-- Labels -->
      <text x="20" y="120" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Start</text>
      <text x="380" y="120" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">End</text>
    </g>

    <!-- Key idea -->
    <g transform="translate(30, 170)">
      <text x="0" y="0" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Core Idea:</text>
      <text x="0" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Make the locally optimal choice at each step</text>
      <text x="0" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">hoping to find the global optimum.</text>
      <text x="0" y="70" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12">Not always optimal! Need proof.</text>
    </g>

    <!-- When to use -->
    <g transform="translate(30, 220)">
      <rect x="0" y="0" width="390" height="30" rx="15" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
      <text x="195" y="20" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Greedy works when: Greedy Choice Property + Optimal Substructure</text>
    </g>
  </g>

  <!-- Classic problems -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="500" height="260" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="250" y="30" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Classic Greedy Problems</text>

    <!-- Problem cards -->
    <g transform="translate(20, 55)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="220" height="65" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="110" y="22" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Activity Selection</text>
      <text x="110" y="42" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Sort by end time</text>
      <text x="110" y="57" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n log n)</text>

      <!-- Card 2 -->
      <rect x="240" y="0" width="220" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="350" y="22" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Huffman Coding</text>
      <text x="350" y="42" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Priority queue</text>
      <text x="350" y="57" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n log n)</text>

      <!-- Card 3 -->
      <rect x="0" y="80" width="220" height="65" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
      <text x="110" y="102" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Fractional Knapsack</text>
      <text x="110" y="122" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Sort by value/weight</text>
      <text x="110" y="137" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n log n)</text>

      <!-- Card 4 -->
      <rect x="240" y="0" width="220" height="65" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="350" y="22" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Interval Scheduling</text>
      <text x="350" y="42" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Earliest finish first</text>
      <text x="350" y="57" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n log n)</text>

      <!-- Card 5 -->
      <rect x="0" y="160" width="220" height="65" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="110" y="182" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Coin Change (greedy)</text>
      <text x="110" y="102" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Largest coin first</text>
      <text x="110" y="117" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n)</text>

      <!-- Card 6 -->
      <rect x="240" y="160" width="220" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="350" y="182" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Jump Game</text>
      <text x="350" y="202" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Track max reach</text>
      <text x="350" y="217" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">O(n)</text>
    </g>
  </g>

  <!-- Template -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Greedy Template:</text>
    <g font-family="monospace" font-size="13">
      <text x="20" y="50" fill="#8b5cf6">def</text>
      <text x="70" y="50" fill="#f43f5e">greedy</text>
      <text x="130" y="50" fill="#94a3b8">(choices):</text>
      <text x="40" y="75" fill="#22d3ee"># 1. Sort by greedy criterion</text>
      <text x="40" y="100" fill="#94a3b8">choices.sort(key=lambda x: x.criterion)</text>
      <text x="40" y="125" fill="#22d3ee"># 2. Make greedy choices</text>
      <text x="40" y="150" fill="#8b5cf6">for</text>
      <text x="80" y="150" fill="#94a3b8">choice in choices:</text>
      <text x="60" y="175" fill="#f43f5e">if</text>
      <text x="100" y="175" fill="#94a3b8">is_valid(choice):</text>
      <text x="80" y="200" fill="#94a3b8">result.append(choice)</text>
      <text x="40" y="225" fill="#8b5cf6">return</text>
      <text x="90" y="225" fill="#94a3b8">result</text>
    </g>
  </g>

  <!-- When greedy fails -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="480" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="20" y="25" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">When Greedy Fails:</text>
    <g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      <text x="20" y="45" fill="#fbbf24">●</text>
      <text x="40" y="45">0/1 Knapsack (use DP instead)</text>
      <text x="20" y="65" fill="#fbbf24">●</text>
      <text x="40" y="65">Coin change with arbitrary denominations</text>
    </g>
  </g>

  <g transform="translate(540, 500)">
    <rect x="0" y="0" width="480" height="80" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="20" y="25" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Proof Techniques:</text>
    <g font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      <text x="20" y="45" fill="#fbbf24">●</text>
      <text x="40" y="45">Exchange argument</text>
      <text x="180" y="45" fill="#64748b">|</text>
      <text x="200" y="45" fill="#f43f5e">●</text>
      <text x="220" y="45">Greedy stays ahead</text>
      <text x="20" y="65" fill="#fbbf24">●</text>
      <text x="40" y="65">Optimal substructure</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="585" text-anchor="middle" fill="url(#accent1)" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" filter="url(#glow)">Greedy Algorithms</text>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">贪心技巧</text>
</svg>
