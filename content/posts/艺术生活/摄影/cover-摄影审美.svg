<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Rule of thirds grid -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="450" height="350" rx="15" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Grid lines -->
    <line x1="150" y1="0" x2="150" y2="350" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="0" x2="300" y2="350" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="116" x2="450" y2="116" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="233" x2="450" y2="233" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <!-- Intersection points -->
    <circle cx="150" cy="116" r="8" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="300" cy="116" r="8" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="150" cy="233" r="8" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="300" cy="233" r="8" fill="#f59e0b" filter="url(#glow)"/>
    <!-- Subject placement -->
    <circle cx="300" cy="116" r="30" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="300" y="122" text-anchor="middle" fill="#10b981" font-size="12" font-family="Arial">主体</text>
    <text x="225" y="375" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">三分法构图 Rule of Thirds</text>
  </g>

  <!-- Leading lines visualization -->
  <g transform="translate(600, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="350" rx="15" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Converging lines -->
    <line x1="50" y1="350" x2="250" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="350" x2="250" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <line x1="250" y1="350" x2="250" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    <line x1="350" y1="350" x2="250" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <line x1="450" y1="350" x2="250" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
    <!-- Vanishing point -->
    <circle cx="250" cy="50" r="15" fill="#3b82f6" filter="url(#glow)"/>
    <text x="250" y="375" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">引导线 Leading Lines</text>
  </g>

  <!-- Composition principles -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="1000" height="100" rx="20" fill="#1a1a1a" opacity="0.8"/>
    <text x="500" y="45" text-anchor="middle" fill="white" font-size="32" font-weight="bold" font-family="Arial, sans-serif">摄影审美 · 构图艺术</text>
    <text x="500" y="78" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">线条流畅性 · 画面完整性 · 视觉引导 · 美学原则</text>
  </g>

  <!-- Aesthetic tips -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="450" height="25" rx="12" fill="url(#amberGrad)"/>
    <text x="225" y="18" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">✓ 避免线条"急转弯"</text>

    <rect x="470" y="0" width="450" height="25" rx="12" fill="url(#blueGrad)"/>
    <text x="695" y="18" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">✓ 避免"缺胳膊少腿"</text>
  </g>

  <!-- Tags -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#amberGrad)"/>
    <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">摄影</text>
    <rect x="115" y="0" width="100" height="35" rx="18" fill="url(#greenGrad)"/>
    <text x="165" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">审美</text>
    <rect x="230" y="0" width="100" height="35" rx="18" fill="url(#blueGrad)"/>
    <text x="280" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">构图</text>
  </g>
</svg>