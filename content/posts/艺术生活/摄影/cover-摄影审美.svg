<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="16%" style="stop-color:#f59e0b"/>
      <stop offset="33%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="66%" style="stop-color:#8b5cf6"/>
      <stop offset="83%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#accentGrad)" opacity="0.05"/>

  <!-- Color wheel - main element -->
  <g transform="translate(600, 280)" filter="url(#glow)">
    <!-- Outer decorative rings -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10,5"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#3b82f6" stroke-width="1"/>

    <!-- Color wheel segments -->
    <g>
      <path d="M 0,0 L 0,-100 A 100,100 0 0,1 86.6,-50 Z" fill="#ef4444" fill-opacity="0.6"/>
      <path d="M 0,0 L 86.6,-50 A 100,100 0 0,1 86.6,50 Z" fill="#f59e0b" fill-opacity="0.6"/>
      <path d="M 0,0 L 86.6,50 A 100,100 0 0,1 0,100 Z" fill="#10b981" fill-opacity="0.6"/>
      <path d="M 0,0 L 0,100 A 100,100 0 0,1 -86.6,50 Z" fill="#3b82f6" fill-opacity="0.6"/>
      <path d="M 0,0 L -86.6,50 A 100,100 0 0,1 -86.6,-50 Z" fill="#8b5cf6" fill-opacity="0.6"/>
      <path d="M 0,0 L -86.6,-50 A 100,100 0 0,1 0,-100 Z" fill="#ec4899" fill-opacity="0.6"/>
    </g>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Center -->
    <circle cx="0" cy="0" r="30" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#3b82f6" stroke-width="1"/>

    <!-- Color names -->
    <text x="0" y="-115" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#ef4444">Red</text>
    <text x="95" y="-55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#f59e0b">Yellow</text>
    <text x="95" y="65" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#10b981">Green</text>
    <text x="0" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#3b82f6">Blue</text>
    <text x="-95" y="65" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#8b5cf6">Purple</text>
    <text x="-95" y="-55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#ec4899">Pink</text>
  </g>

  <!-- Color harmony triangles -->
  <g transform="translate(600, 280)">
    <!-- Complementary -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Triadic -->
    <polygon points="0,-100 86.6,50 -86.6,50" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Split complementary -->
    <polygon points="0,-100 86.6,-50 -86.6,-50" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  </g>

  <!-- RGB model on left -->
  <g transform="translate(100, 380)" filter="url(#glow)">
    <circle cx="50" cy="30" r="30" fill="#ef4444" fill-opacity="0.4" stroke="#ef4444" stroke-width="1"/>
    <circle cx="100" cy="30" r="30" fill="#10b981" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <circle cx="75" cy="70" r="30" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="75" cy="30" r="20" fill="#f59e0b" fill-opacity="0.5"/>
    <text x="75" y="110" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#e0e0e0">RGB Color Model</text>
  </g>

  <!-- HSL cylinder on right -->
  <g transform="translate(950, 380)" filter="url(#glow)">
    <ellipse cx="50" cy="10" rx="40" ry="15" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="10" y1="10" x2="10" y2="80" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="90" y1="10" x2="90" y2="80" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="50" cy="80" rx="40" ry="15" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Hue gradient -->
    <defs>
      <linearGradient id="hueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ef4444"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
    </defs>
    <rect x="12" y="15" width="76" height="60" fill="url(#hueGrad)" fill-opacity="0.3"/>
    <text x="50" y="105" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#e0e0e0">HSL Color Space</text>
  </g>

  <!-- Title text -->
  <text x="600" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" fill="#e0e0e0" font-weight="bold" letter-spacing="4">摄影审美</text>
  <text x="600" y="160" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#f59e0b" letter-spacing="2">Photography Aesthetics</text>

  <!-- Decorative elements -->
  <g stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#f59e0b" opacity="0.5">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="1050" cy="500" r="3"/>
    <circle cx="800" cy="100" r="2"/>
  </g>
</svg>