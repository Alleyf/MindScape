<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Camera lens visualization -->
  <g transform="translate(150, 150)" filter="url(#shadow)">
    <!-- Outer ring -->
    <circle cx="180" cy="140" r="140" fill="#1a1a1a" stroke="#f59e0b" stroke-width="8"/>
    <!-- Inner rings -->
    <circle cx="180" cy="140" r="110" fill="#2d2d2d" stroke="#64748b" stroke-width="3"/>
    <circle cx="180" cy="140" r="80" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
    <!-- Lens center -->
    <circle cx="180" cy="140" r="50" fill="url(#blueGrad)" filter="url(#glow)"/>
    <circle cx="180" cy="140" r="35" fill="#1e3a5f"/>
    <!-- Aperture blades -->
    <g opacity="0.6">
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b"/>
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b" transform="rotate(60, 180, 140)"/>
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b" transform="rotate(120, 180, 140)"/>
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b" transform="rotate(180, 180, 140)"/>
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b" transform="rotate(240, 180, 140)"/>
      <polygon points="180,105 195,120 180,135 165,120" fill="#f59e0b" transform="rotate(300, 180, 140)"/>
    </g>
    <!-- Focus ring -->
    <circle cx="180" cy="140" r="125" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="10,5"/>
  </g>

  <!-- Camera modes panel -->
  <g transform="translate(500, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="620" height="300" rx="20" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <text x="310" y="50" text-anchor="middle" fill="#f59e0b" font-size="20" font-weight="bold" font-family="Arial">📷 相机挡位模式</text>

    <!-- Mode buttons -->
    <g transform="translate(30, 80)">
      <!-- P Mode -->
      <rect x="0" y="0" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#f59e0b" stroke-width="2"/>
      <text x="60" y="40" text-anchor="middle" fill="#f59e0b" font-size="28" font-weight="bold" font-family="Arial">P</text>
      <text x="60" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">程序自动</text>

      <!-- A/Av Mode -->
      <rect x="140" y="0" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#3b82f6" stroke-width="2"/>
      <text x="200" y="40" text-anchor="middle" fill="#3b82f6" font-size="28" font-weight="bold" font-family="Arial">A</text>
      <text x="200" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">光圈优先</text>

      <!-- S/Tv Mode -->
      <rect x="280" y="0" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#10b981" stroke-width="2"/>
      <text x="340" y="40" text-anchor="middle" fill="#10b981" font-size="28" font-weight="bold" font-family="Arial">S</text>
      <text x="340" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">快门优先</text>

      <!-- M Mode -->
      <rect x="420" y="0" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#ef4444" stroke-width="2"/>
      <text x="480" y="40" text-anchor="middle" fill="#ef4444" font-size="28" font-weight="bold" font-family="Arial">M</text>
      <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">手动模式</text>

      <!-- Auto Mode -->
      <rect x="0" y="100" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#10b981" stroke-width="2"/>
      <text x="60" y="45" text-anchor="middle" fill="#10b981" font-size="20" font-weight="bold" font-family="Arial">Auto</text>
      <text x="60" y="70" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">全自动</text>

      <!-- B Mode -->
      <rect x="140" y="100" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#8b5cf6" stroke-width="2"/>
      <text x="200" y="40" text-anchor="middle" fill="#8b5cf6" font-size="28" font-weight="bold" font-family="Arial">B</text>
      <text x="200" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">B门</text>

      <!-- SCN Mode -->
      <rect x="280" y="100" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#f59e0b" stroke-width="2"/>
      <text x="340" y="40" text-anchor="middle" fill="#f59e0b" font-size="24" font-weight="bold" font-family="Arial">SCN</text>
      <text x="340" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">场景模式</text>

      <!-- Video Mode -->
      <rect x="420" y="100" width="120" height="80" rx="12" fill="#2d2d2d" stroke="#ef4444" stroke-width="2"/>
      <text x="480" y="40" text-anchor="middle" fill="#ef4444" font-size="24" font-weight="bold" font-family="Arial">🎬</text>
      <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">视频模式</text>
    </g>
  </g>

  <!-- Exposure triangle -->
  <g transform="translate(100, 450)">
    <polygon points="200,0 0,180 400,180" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <!-- ISO -->
    <circle cx="200" cy="30" r="40" fill="url(#amberGrad)" filter="url(#glow)"/>
    <text x="200" y="42" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">ISO</text>
    <!-- Aperture -->
    <circle cx="70" cy="150" r="40" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="70" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">光圈</text>
    <!-- Shutter -->
    <circle cx="330" cy="150" r="40" fill="url(#greenGrad)" filter="url(#glow)"/>
    <text x="330" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">快门</text>
  </g>

  <!-- Title -->
  <g transform="translate(550, 460)">
    <rect x="0" y="0" width="550" height="140" rx="20" fill="#1a1a1a" opacity="0.8"/>
    <text x="275" y="55" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Arial, sans-serif">摄影基础指南</text>
    <text x="275" y="95" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">相机挡位 · 曝光三角 · 摄影入门</text>
    <text x="275" y="125" text-anchor="middle" fill="#f59e0b" font-size="14" font-family="Arial, sans-serif">📷 从入门到精通</text>
  </g>

  <!-- Tags -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#amberGrad)"/>
    <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">摄影</text>
    <rect x="115" y="0" width="100" height="35" rx="18" fill="url(#blueGrad)"/>
    <text x="165" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">入门</text>
    <rect x="230" y="0" width="100" height="35" rx="18" fill="url(#greenGrad)"/>
    <text x="280" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">PLOG</text>
  </g>
</svg>