<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#accentGrad)" opacity="0.05"/>

  <!-- Camera body illustration -->
  <g transform="translate(400, 180)" filter="url(#glow)">
    <!-- Camera body -->
    <rect x="0" y="0" width="200" height="140" rx="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="20" y="20" width="160" height="100" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Lens -->
    <circle cx="100" cy="70" r="45" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="100" cy="70" r="35" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="100" cy="70" r="25" fill="none" stroke="#3b82f6" stroke-width="1"/>

    <!-- Viewfinder -->
    <rect x="160" y="10" width="30" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Flash -->
    <rect x="10" y="10" width="25" height="15" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Buttons -->
    <circle cx="175" cy="50" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="175" cy="80" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="175" cy="110" r="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Lens ring detail -->
  <g transform="translate(700, 250)" filter="url(#glow)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <!-- Focal length markings -->
    <text x="0" y="-85" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#f59e0b">50mm</text>
    <text x="0" y="95" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#3b82f6">f/1.8</text>
  </g>

  <!-- Focus distance scale -->
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="300" height="40" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="280" y2="20" stroke="#3b82f6" stroke-width="1"/>
    <line x1="20" y1="15" x2="20" y2="25" stroke="#f59e0b" stroke-width="1"/>
    <line x1="80" y1="15" x2="80" y2="25" stroke="#f59e0b" stroke-width="1"/>
    <line x1="140" y1="15" x2="140" y2="25" stroke="#f59e0b" stroke-width="1"/>
    <line x1="200" y1="15" x2="200" y2="25" stroke="#f59e0b" stroke-width="1"/>
    <line x1="260" y1="15" x2="260" y2="25" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="38" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="9" fill="#e0e0e0">∞</text>
    <text x="80" y="38" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="9" fill="#e0e0e0">5m</text>
    <text x="140" y="38" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="9" fill="#e0e0e0">2m</text>
    <text x="200" y="38" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="9" fill="#e0e0e0">1m</text>
    <text x="260" y="38" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="9" fill="#e0e0e0">0.5m</text>
  </g>

  <!-- Aperture settings -->
  <g transform="translate(500, 420)">
    <rect x="0" y="0" width="200" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0e0">Aperture Settings</text>
  </g>

  <!-- Aperture values -->
  <g transform="translate(750, 420)">
    <rect x="0" y="0" width="250" height="40" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#f59e0b">f/1.4</text>
    <text x="60" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#3b82f6">f/2.0</text>
    <text x="100" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#10b981">f/2.8</text>
    <text x="140" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#f59e0b">f/4</text>
    <text x="180" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#3b82f6">f/5.6</text>
    <text x="220" y="25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#10b981">f/8</text>
  </g>

  <!-- ISO and shutter speed indicators -->
  <g transform="translate(1000, 180)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0e0">ISO</text>
    <text x="60" y="60" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#f59e0b" font-weight="bold">100</text>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#3b82f6" stroke-width="1"/>
    <text x="60" y="105" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0e0">Shutter</text>
    <text x="60" y="135" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#3b82f6" font-weight="bold">1/125</text>
  </g>

  <!-- Title text -->
  <text x="600" y="100" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" fill="#e0e0e0" font-weight="bold" letter-spacing="4">摄影基础指南</text>
  <text x="600" y="140" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#f59e0b" letter-spacing="2">Photography Basics Guide</text>

  <!-- Decorative elements -->
  <g stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#f59e0b" opacity="0.5">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="1050" cy="500" r="3"/>
    <circle cx="800" cy="100" r="2"/>
  </g>
</svg>