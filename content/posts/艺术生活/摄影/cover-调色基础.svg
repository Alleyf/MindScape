<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="colorWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="16%" style="stop-color:#f97316"/>
      <stop offset="33%" style="stop-color:#eab308"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="66%" style="stop-color:#06b6d4"/>
      <stop offset="83%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Color wheel -->
  <g transform="translate(200, 200)" filter="url(#shadow)">
    <circle cx="150" cy="130" r="120" fill="url(#colorWheel)" filter="url(#glow)"/>
    <circle cx="150" cy="130" r="90" fill="#1a1a1a"/>
    <circle cx="150" cy="130" r="60" fill="url(#colorWheel)" opacity="0.8"/>
    <circle cx="150" cy="130" r="30" fill="#1a1a1a"/>
    <!-- Color labels -->
    <text x="150" y="15" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold" font-family="Arial">红</text>
    <text x="255" y="75" text-anchor="middle" fill="#f97316" font-size="12" font-weight="bold" font-family="Arial">橙</text>
    <text x="290" y="180" text-anchor="middle" fill="#eab308" font-size="12" font-weight="bold" font-family="Arial">黄</text>
    <text x="230" y="260" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold" font-family="Arial">绿</text>
    <text x="150" y="280" text-anchor="middle" fill="#06b6d4" font-size="12" font-weight="bold" font-family="Arial">青</text>
    <text x="70" y="260" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold" font-family="Arial">紫</text>
    <text x="20" y="180" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold" font-family="Arial">品</text>
    <text x="45" y="75" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="bold" font-family="Arial">玫</text>
    <text x="150" y="135" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">色轮</text>
  </g>

  <!-- Tone categories -->
  <g transform="translate(500, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="320" rx="20" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="45" text-anchor="middle" fill="#f59e0b" font-size="20" font-weight="bold" font-family="Arial">影调分类 Tone Categories</text>

    <!-- Bright tone -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="170" height="100" rx="15" fill="#1a1a1a" stroke="#fbbf24" stroke-width="2"/>
      <rect x="15" y="15" width="140" height="50" rx="8" fill="#fef3c7"/>
      <rect x="15" y="70" width="140" height="20" rx="4" fill="#fbbf24"/>
      <text x="85" y="125" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold" font-family="Arial">亮调 Bright</text>
    </g>

    <!-- Mid tone -->
    <g transform="translate(215, 70)">
      <rect x="0" y="0" width="170" height="100" rx="15" fill="#1a1a1a" stroke="#94a3b8" stroke-width="2"/>
      <rect x="15" y="15" width="140" height="50" rx="8" fill="#e2e8f0"/>
      <rect x="15" y="70" width="140" height="20" rx="4" fill="#94a3b8"/>
      <text x="85" y="125" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="bold" font-family="Arial">中间调 Mid</text>
    </g>

    <!-- Dark tone -->
    <g transform="translate(400, 70)">
      <rect x="0" y="0" width="170" height="100" rx="15" fill="#1a1a1a" stroke="#64748b" stroke-width="2"/>
      <rect x="15" y="15" width="140" height="50" rx="8" fill="#475569"/>
      <rect x="15" y="70" width="140" height="20" rx="4" fill="#64748b"/>
      <text x="85" y="125" text-anchor="middle" fill="#64748b" font-size="16" font-weight="bold" font-family="Arial">暗调 Dark</text>
    </g>

    <!-- Complementary colors -->
    <text x="300" y="210" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">互补色 Complementary Colors</text>
    <g transform="translate(100, 230)">
      <rect x="0" y="0" width="400" height="60" rx="10" fill="#0f172a"/>
      <circle cx="50" cy="30" r="20" fill="#ef4444"/>
      <circle cx="150" cy="30" r="20" fill="#06b6d4"/>
      <text x="100" y="35" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">红 ↔ 青</text>

      <circle cx="250" cy="30" r="20" fill="#eab308"/>
      <circle cx="350" cy="30" r="20" fill="#8b5cf6"/>
      <text x="300" y="35" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">黄 ↔ 紫</text>
    </g>
  </g>

  <!-- Color grading workflow -->
  <g transform="translate(100, 460)">
    <rect x="0" y="0" width="400" height="140" rx="15" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold" font-family="Arial">调色流程 Color Grading</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="url(#amberGrad)" filter="url(#glow)"/>
      <text x="80" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">定影调</text>
      <text x="80" y="45" text-anchor="middle" fill="white" font-size="11" font-family="Arial">先定明暗对比</text>

      <polygon points="170,30 190,30 180,40" fill="#64748b"/>

      <rect x="200" y="0" width="160" height="60" rx="10" fill="url(#blueGrad)" filter="url(#glow)"/>
      <text x="280" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">定色调</text>
      <text x="280" y="45" text-anchor="middle" fill="white" font-size="11" font-family="Arial">再定色彩搭配</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(550, 480)">
    <rect x="0" y="0" width="550" height="120" rx="20" fill="#1a1a1a" opacity="0.8"/>
    <text x="275" y="45" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Arial, sans-serif">调色基础</text>
    <text x="275" y="80" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">影调与色调 · 色彩搭配 · 后期调色</text>
    <text x="275" y="105" text-anchor="middle" fill="#f59e0b" font-size="14" font-family="Arial, sans-serif">调色 = 影调 + 色调</text>
  </g>

  <!-- Tags -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#amberGrad)"/>
    <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">摄影</text>
    <rect x="115" y="0" width="100" height="35" rx="18" fill="url(#blueGrad)"/>
    <text x="165" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">调色</text>
    <rect x="230" y="0" width="100" height="35" rx="18" fill="url(#greenGrad)"/>
    <text x="280" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">后期</text>
  </g>
</svg>