<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle gradient overlay -->
  <rect width="1200" height="630" fill="url(#accentGrad)" opacity="0.05"/>

  <!-- Camera aperture blades -->
  <g transform="translate(600, 280)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Aperture blades -->
    <g transform="rotate(0)">
      <path d="M 0,0 L 0,-90 A 90,90 0 0,1 85,-30 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 0,0 L 85,-30 A 90,90 0 0,1 55,75 Z" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 0,0 L 55,75 A 90,90 0 0,1 -30,85 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 0,0 L -30,85 A 90,90 0 0,1 -90,0 Z" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 0,0 L -90,0 A 90,90 0 0,1 -55,-75 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 0,0 L -55,-75 A 90,90 0 0,1 30,-85 Z" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 0,0 L 30,-85 A 90,90 0 0,1 0,-90 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
    </g>

    <!-- Center hole -->
    <circle cx="0" cy="0" r="30" fill="#1a1a1a" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>
  </g>

  <!-- Lens elements on left -->
  <g transform="translate(150, 300)">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="45" ry="60" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Light rays -->
  <g stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2">
    <line x1="100" y1="100" x2="600" y2="280"/>
    <line x1="150" y1="80" x2="600" y2="280"/>
    <line x1="200" y1="100" x2="600" y2="280"/>
  </g>

  <!-- Color wheel on right -->
  <g transform="translate(900, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <!-- Color segments -->
    <path d="M 0,0 L 0,-70 A 70,70 0 0,1 60,-35 Z" fill="#f59e0b" fill-opacity="0.4"/>
    <path d="M 0,0 L 60,-35 A 70,70 0 0,1 60,35 Z" fill="#3b82f6" fill-opacity="0.4"/>
    <path d="M 0,0 L 60,35 A 70,70 0 0,1 0,70 Z" fill="#10b981" fill-opacity="0.4"/>
    <path d="M 0,0 L 0,70 A 70,70 0 0,1 -60,35 Z" fill="#f59e0b" fill-opacity="0.4"/>
    <path d="M 0,0 L -60,35 A 70,70 0 0,1 -60,-35 Z" fill="#3b82f6" fill-opacity="0.4"/>
    <path d="M 0,0 L -60,-35 A 70,70 0 0,1 0,-70 Z" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="0" cy="0" r="20" fill="#1a1a1a" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- Portrait frame icon -->
  <g transform="translate(200, 480)">
    <rect x="0" y="0" width="100" height="130" rx="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="45" r="25" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <ellipse cx="50" cy="95" rx="30" ry="20" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Title text -->
  <text x="600" y="140" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" fill="#e0e0e0" font-weight="bold" letter-spacing="4">人像摄影技巧</text>
  <text x="600" y="180" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#f59e0b" letter-spacing="2">Portrait Photography Tips</text>

  <!-- Decorative elements -->
  <g stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#f59e0b" opacity="0.5">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="1050" cy="500" r="3"/>
    <circle cx="800" cy="100" r="2"/>
  </g>
</svg>