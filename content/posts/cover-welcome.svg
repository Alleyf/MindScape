<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <g transform="translate(600, 315)" opacity="0.06">
    <circle cx="0" cy="0" r="250" fill="url(#star)"/>
  </g>
  <g transform="translate(600, 315)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <g opacity="0.4">
      <line x1="-120" y1="0" x2="-80" y2="0" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="80" y1="0" x2="120" y2="0" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="0" y1="-120" x2="0" y2="-80" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="0" y1="80" x2="0" y2="120" stroke="#8b5cf6" stroke-width="2"/>
    </g>
    <path d="M-40,-40 L40,40 M40,-40 L-40,40" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="#8b5cf6"/>
  </g>
  <g opacity="0.25">
    <circle cx="150" cy="150" r="25" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="1050" cy="150" r="25" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="150" cy="480" r="20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="1050" cy="480" r="20" fill="none" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="600" y="260" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="72" font-weight="bold">Welcome</text>
  <text x="600" y="330" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="300" letter-spacing="12">M I N D S C A P E</text>
  <g transform="translate(600, 400)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#8b5cf6" opacity="0.15"/>
    <text x="0" y="6" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="14">Creative Wikiblog</text>
  </g>
  <text x="600" y="560" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">Your Knowledge, Your Universe</text>
  <path d="M0,50 L0,0 L50,0" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
  <path d="M1200,50 L1200,0 L1150,0" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
  <path d="M0,580 L0,630 L50,630" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
  <path d="M1200,580 L1200,630 L1150,630" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
