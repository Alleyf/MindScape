<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    <clipPath id="cloudClip">
      <ellipse cx="100" cy="50" rx="80" ry="40"/>
      <ellipse cx="150" cy="40" rx="60" ry="35"/>
      <ellipse cx="60" cy="45" rx="50" ry="30"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Cloud shapes in background -->
  <g opacity="0.15" fill="#0ea5e9">
    <ellipse cx="200" cy="100" rx="120" ry="50"/>
    <ellipse cx="280" cy="80" rx="80" ry="40"/>
    <ellipse cx="140" cy="90" rx="70" ry="35"/>

    <ellipse cx="900" cy="120" rx="100" ry="45"/>
    <ellipse cx="980" cy="100" rx="70" ry="35"/>
    <ellipse cx="850" cy="110" rx="60" ry="30"/>

    <ellipse cx="600" cy="50" rx="90" ry="40"/>
    <ellipse cx="680" cy="35" rx="65" ry="30"/>
  </g>

  <!-- Learning path diagram -->
  <g transform="translate(80, 100)">
    <!-- Path line -->
    <path d="M 50 280 L 200 200 L 350 280 L 500 200 L 650 280"
          stroke="#0ea5e9" stroke-width="3" fill="none" stroke-dasharray="8,4" opacity="0.6"/>

    <!-- Step nodes -->
    <g filter="url(#shadow)">
      <!-- Step 1: OS -->
      <rect x="0" y="240" width="100" height="80" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
      <text x="50" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Step 1</text>
      <text x="50" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">Linux</text>
      <circle cx="50" cy="220" r="8" fill="#0ea5e9"/>
      <text x="50" y="224" text-anchor="middle" font-size="10" fill="#fff">1</text>

      <!-- Step 2: Network -->
      <rect x="150" y="160" width="100" height="80" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
      <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Step 2</text>
      <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">Network</text>
      <circle cx="200" cy="140" r="8" fill="#0ea5e9"/>
      <text x="200" y="144" text-anchor="middle" font-size="10" fill="#fff">2</text>

      <!-- Step 3: Docker -->
      <rect x="300" y="240" width="100" height="80" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
      <text x="350" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Step 3</text>
      <text x="350" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">Docker</text>
      <circle cx="350" cy="220" r="8" fill="#0ea5e9"/>
      <text x="350" y="224" text-anchor="middle" font-size="10" fill="#fff">3</text>

      <!-- Step 4: K8s -->
      <rect x="450" y="160" width="100" height="80" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
      <text x="500" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Step 4</text>
      <text x="500" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">K8s</text>
      <circle cx="500" cy="140" r="8" fill="#0ea5e9"/>
      <text x="500" y="144" text-anchor="middle" font-size="10" fill="#fff">4</text>

      <!-- Step 5: CI/CD -->
      <rect x="600" y="240" width="100" height="80" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
      <text x="650" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Step 5</text>
      <text x="650" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">CI/CD</text>
      <circle cx="650" cy="220" r="8" fill="#0ea5e9"/>
      <text x="650" y="224" text-anchor="middle" font-size="10" fill="#fff">5</text>
    </g>
  </g>

  <!-- Cloud infrastructure icon -->
  <g transform="translate(850, 80)" filter="url(#shadow)">
    <!-- Cloud base -->
    <path d="M 100 180
             C 60 180, 30 150, 30 110
             C 30 70, 60 40, 100 40
             C 120 20, 160 15, 190 30
             C 230 25, 270 55, 270 95
             C 270 140, 230 180, 180 180
             Z"
          fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Cloud outline -->
    <path d="M 100 170
             C 65 170, 40 145, 40 110
             C 40 75, 65 50, 100 50
             C 118 32, 152 28, 178 42
             C 212 38, 245 62, 245 98
             C 245 138, 210 170, 170 170
             Z"
          fill="none" stroke="#0ea5e9" stroke-width="3" filter="url(#glow)"/>

    <!-- Services inside cloud -->
    <g transform="translate(100, 90)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8">AWS</text>
    </g>

    <g transform="translate(170, 110)">
      <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38bdf8">Azure</text>
    </g>

    <g transform="translate(130, 60)">
      <rect x="-45" y="-25" width="90" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38bdf8">GCP</text>
    </g>
  </g>

  <!-- Database icon -->
  <g transform="translate(80, 420)">
    <ellipse cx="60" cy="20" rx="50" ry="18" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="10" y="20" width="100" height="50" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <ellipse cx="60" cy="70" rx="50" ry="18" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <ellipse cx="60" cy="35" rx="40" ry="12" fill="none" stroke="#334155" stroke-width="1"/>
    <ellipse cx="60" cy="50" rx="40" ry="12" fill="none" stroke="#334155" stroke-width="1"/>
    <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">MySQL / MongoDB</text>
  </g>

  <!-- Docker icon -->
  <g transform="translate(200, 420)">
    <!-- Whale body -->
    <path d="M 20 40 Q 20 10, 50 10 Q 80 10, 80 40 Q 80 60, 60 60 L 60 70 L 40 70 L 40 60 Q 20 60, 20 40 Z"
          fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Containers on whale -->
    <rect x="30" y="5" width="15" height="12" rx="2" fill="#38bdf8"/>
    <rect x="50" y="5" width="15" height="12" rx="2" fill="#0ea5e9"/>
    <rect x="65" y="10" width="12" height="10" rx="2" fill="#7dd3fc"/>
    <!-- Eye -->
    <circle cx="65" cy="25" r="4" fill="#f8fafc"/>
    <circle cx="66" cy="25" r="2" fill="#1e293b"/>
    <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Docker</text>
  </g>

  <!-- Kubernetes icon -->
  <g transform="translate(320, 420)">
    <!-- Hexagon -->
    <polygon points="50,5 95,30 95,80 50,105 5,80 5,30"
             fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Inner hexagon -->
    <polygon points="50,25 75,40 75,65 50,80 25,65 25,40"
             fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Center circle -->
    <circle cx="50" cy="50" r="12" fill="#0ea5e9"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">K8s</text>
    <text x="50" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Kubernetes</text>
  </g>

  <!-- Main title area -->
  <g transform="translate(480, 350)">
    <!-- Decorative line -->
    <rect x="0" y="0" width="80" height="4" fill="url(#skyGrad)" rx="2"/>

    <!-- Title -->
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="36" fill="#f8fafc" font-weight="bold">云计算及基础平台</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="36" fill="#0ea5e9" font-weight="bold">学习清单</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Cloud Computing &amp; Infrastructure Learning Path</text>

    <!-- Tags -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <text x="45" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0ea5e9">云计算</text>

      <rect x="105" y="0" width="80" height="28" rx="14" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="145" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8">DevOps</text>

      <rect x="200" y="0" width="90" height="28" rx="14" fill="#64748b" opacity="0.15" stroke="#64748b" stroke-width="1"/>
      <text x="245" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">学习清单</text>
    </g>
  </g>

  <!-- Checklist panel on right -->
  <g transform="translate(950, 340)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="90" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0ea5e9" font-weight="bold">Learning Goals</text>
    <line x1="20" y1="48" x2="160" y2="48" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20, 65)">
      <circle cx="10" cy="10" r="6" fill="#0ea5e9"/>
      <path d="M 7 10 L 9 12 L 13 8" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="25" y="14" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Linux Basics</text>

      <circle cx="10" cy="35" r="6" fill="#0ea5e9"/>
      <path d="M 7 35 L 9 37 L 13 33" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="25" y="39" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Network Protocols</text>

      <circle cx="10" cy="60" r="6" fill="#0ea5e9"/>
      <path d="M 7 60 L 9 62 L 13 58" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="25" y="64" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Docker &amp; Containers</text>

      <circle cx="10" cy="85" r="6" fill="#fbbf24"/>
      <text x="25" y="89" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Kubernetes (Advanced)</text>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0f172a"/>
  <rect x="0" y="590" width="1200" height="4" fill="url(#skyGrad)"/>

  <!-- Decorative dots pattern -->
  <g opacity="0.3">
    <circle cx="80" cy="30" r="3" fill="#0ea5e9"/>
    <circle cx="100" cy="30" r="3" fill="#0ea5e9"/>
    <circle cx="120" cy="30" r="3" fill="#0ea5e9"/>
    <circle cx="80" cy="50" r="3" fill="#0ea5e9"/>
    <circle cx="100" cy="50" r="3" fill="#0ea5e9"/>
    <circle cx="120" cy="50" r="3" fill="#0ea5e9"/>
  </g>
</svg>