<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#44403c" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="315" r="250" fill="#f97316" opacity="0.05"/>
  <circle cx="200" cy="200" r="120" fill="#f97316" opacity="0.04"/>
  <g transform="translate(600, 260)">
    <path d="M0,-100 L80,-20 L80,60 L0,140 L-80,60 L-80,-20 Z" fill="none" stroke="url(#gitOrange)" stroke-width="4"/>
    <line x1="0" y1="-60" x2="0" y2="100" stroke="#f97316" stroke-width="2"/>
    <ellipse cx="0" cy="-70" rx="25" ry="15" fill="#f97316"/>
    <ellipse cx="0" cy="20" rx="20" ry="12" fill="#f97316" opacity="0.7"/>
    <ellipse cx="0" cy="90" rx="15" ry="10" fill="#f97316" opacity="0.5"/>
    <path d="M0,-55 Q40,-40 50,-10" stroke="#f97316" stroke-width="2" fill="none"/>
    <path d="M0,5 Q-35,20 -45,45" stroke="#f97316" stroke-width="2" fill="none"/>
    <circle cx="50" cy="-10" r="8" fill="#f97316" opacity="0.8"/>
    <circle cx="-45" cy="45" r="8" fill="#f97316" opacity="0.8"/>
  </g>
  <g transform="translate(200, 350)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#f97316" stroke-width="3"/>
    <path d="M80,0 Q80,-40 120,-40 L180,-40 Q200,-40 200,0" stroke="#f97316" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="8" fill="#f97316"/>
    <circle cx="80" cy="0" r="8" fill="#f97316"/>
    <circle cx="160" cy="0" r="8" fill="#f97316"/>
    <circle cx="240" cy="0" r="8" fill="#f97316"/>
    <circle cx="300" cy="0" r="10" fill="#f97316"/>
    <circle cx="120" cy="-40" r="6" fill="#f97316" opacity="0.7"/>
    <circle cx="160" cy="-40" r="6" fill="#f97316" opacity="0.7"/>
    <circle cx="200" cy="0" r="8" fill="#f97316"/>
    <text x="300" y="30" font-family="monospace" font-size="12" fill="#f97316">main</text>
    <text x="200" y="-55" font-family="monospace" font-size="12" fill="#f97316">feature</text>
  </g>
  <g transform="translate(800, 350)">
    <line x1="0" y1="-40" x2="100" y2="-40" stroke="#f97316" stroke-width="2"/>
    <line x1="0" y1="40" x2="100" y2="40" stroke="#f97316" stroke-width="2"/>
    <path d="M100,-40 Q140,0 180,0 Q220,0 220,40" stroke="#f97316" stroke-width="2" fill="none"/>
    <circle cx="0" cy="-40" r="6" fill="#f97316" opacity="0.6"/>
    <circle cx="0" cy="40" r="6" fill="#f97316" opacity="0.6"/>
    <circle cx="220" cy="40" r="8" fill="#f97316"/>
    <text x="110" y="70" font-family="monospace" font-size="12" fill="#f97316">merge</text>
  </g>
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="320" height="180" rx="10" fill="#0c0a09" stroke="#44403c" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="28" rx="10" fill="#1c1917"/>
    <rect x="0" y="18" width="320" height="10" fill="#1c1917"/>
    <circle cx="20" cy="14" r="5" fill="#ef4444"/>
    <circle cx="40" cy="14" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="14" r="5" fill="#22c55e"/>
    <text x="15" y="55" font-family="monospace" font-size="12" fill="#22c55e">$ git checkout -b feature</text>
    <text x="15" y="80" font-family="monospace" font-size="12" fill="#f8fafc">Switched to new branch 'feature'</text>
    <text x="15" y="105" font-family="monospace" font-size="12" fill="#22c55e">$ git commit -m "init feature"</text>
    <text x="15" y="130" font-family="monospace" font-size="12" fill="#f8fafc">[feature a1b2c3d] init feature</text>
    <text x="15" y="155" font-family="monospace" font-size="12" fill="#64748b"> 1 file changed, 10 insertions</text>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Git</text>
  <text x="600" y="575" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8">版本控制简记</text>
  <g transform="translate(400, 600)">
    <rect x="-55" y="-18" width="110" height="28" rx="14" fill="#f97316" opacity="0.15"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="12" fill="#f97316">Commit</text>
  </g>
  <g transform="translate(560, 600)">
    <rect x="-50" y="-18" width="100" height="28" rx="14" fill="#f97316" opacity="0.15"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="12" fill="#f97316">Branch</text>
  </g>
  <g transform="translate(720, 600)">
    <rect x="-50" y="-18" width="100" height="28" rx="14" fill="#f97316" opacity="0.15"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="12" fill="#f97316">Merge</text>
  </g>
</svg>
