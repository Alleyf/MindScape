<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(600, 260)">
    <rect x="-120" y="-160" width="240" height="320" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect x="60" y="-180" width="80" height="40" rx="6" fill="#3b82f6"/>
    <text x="100" y="-153" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#fff">MD</text>
    <g transform="translate(-100, -120)" font-family="monospace" font-size="14">
      <text fill="#64748b"># Title</text>
      <text y="25" fill="#94a3b8">**bold** and _italic_</text>
      <text y="55" fill="#22c55e">```python</text>
      <text y="75" fill="#94a3b8">def hello():</text>
      <text y="95" fill="#f59e0b">  print("hi")</text>
      <text y="115" fill="#22c55e">```</text>
      <text y="145" fill="#3b82f6">- item 1</text>
      <text y="165" fill="#3b82f6">- item 2</text>
      <text y="195" fill="#64748b">```mermaid</text>
      <text y="215" fill="#94a3b8">graph LR</text>
      <text y="235" fill="#94a3b8">  A--&gt;B</text>
    </g>
  </g>
  <g transform="translate(900, 500)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
    <text x="100" y="25" text-anchor="middle" font-family="system-ui" font-size="12" fill="#3b82f6">Mermaid Diagram</text>
    <g transform="translate(30, 45)">
      <circle cx="0" cy="0" r="12" fill="#3b82f6" opacity="0.5"/>
      <circle cx="70" cy="0" r="12" fill="#3b82f6" opacity="0.5"/>
      <circle cx="140" cy="0" r="12" fill="#3b82f6" opacity="0.5"/>
      <line x1="12" y1="0" x2="58" y2="0" stroke="#3b82f6" stroke-width="2"/>
      <line x1="82" y1="0" x2="128" y2="0" stroke="#3b82f6" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="32" text-anchor="middle" font-family="system-ui" font-size="14" fill="#3b82f6">Start</text>
    <line x1="60" y1="50" x2="60" y2="80" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="80" width="120" height="50" rx="6" fill="#3b82f6" opacity="0.4" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="112" text-anchor="middle" font-family="system-ui" font-size="14" fill="#3b82f6">Process</text>
  </g>
  <g fill="#3b82f6" opacity="0.15" font-family="monospace" font-weight="700">
    <text x="80" y="100" font-size="48">#</text>
    <text x="1050" y="150" font-size="72">#</text>
    <text x="180" y="550" font-size="36">##</text>
    <text x="1000" y="400" font-size="48">###</text>
  </g>
  <text x="600" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff">MarkDown 真经</text>
  <text x="600" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#3b82f6" letter-spacing="4">MARKDOWN · MERMAID · CHARTS</text>
