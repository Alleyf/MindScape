<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#f97316" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#ef4444" stroke-width="1"/>
  </g>

  <!-- Server rack icon -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Server units -->
    <g fill="#0f3460" stroke="#334155" stroke-width="1">
      <rect x="10" y="15" width="160" height="55" rx="4"/>
      <rect x="10" y="85" width="160" height="55" rx="4"/>
      <rect x="10" y="155" width="160" height="55" rx="4"/>
      <rect x="10" y="225" width="160" height="55" rx="4"/>
      <rect x="10" y="295" width="160" height="55" rx="4"/>
    </g>
    <!-- Status lights -->
    <g>
      <circle cx="30" cy="42" r="5" fill="#22c55e"/>
      <circle cx="30" cy="112" r="5" fill="#f97316"/>
      <circle cx="30" cy="182" r="5" fill="#22c55e"/>
      <circle cx="30" cy="252" r="5" fill="#ef4444" filter="url(#glow)"/>
      <circle cx="30" cy="322" r="5" fill="#22c55e"/>
    </g>
    <!-- Warning indicator -->
    <polygon points="140,235 155,260 125,260" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- Terminal window -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="200" rx="8" fill="#1e293b"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="420" height="32" rx="8" fill="#334155"/>
    <rect x="0" y="20" width="420" height="12" fill="#334155"/>
    <!-- Window buttons -->
    <circle cx="20" cy="16" r="6" fill="#ef4444"/>
    <circle cx="42" cy="16" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="16" r="6" fill="#22c55e"/>
    <!-- Terminal content -->
    <text x="20" y="70" font-family="monospace" font-size="14" fill="#22c55e">$ systemctl status nginx</text>
    <text x="20" y="100" font-family="monospace" font-size="14" fill="#94a3b8">● nginx.service - A high performance web server</text>
    <text x="20" y="125" font-family="monospace" font-size="14" fill="#ef4444">   ✗ failed to start</text>
    <text x="20" y="155" font-family="monospace" font-size="14" fill="#f97316">   → Check logs: journalctl -u nginx</text>
  </g>

  <!-- Network topology -->
  <g transform="translate(800, 100)">
    <!-- Central node -->
    <circle cx="120" cy="120" r="50" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
    <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f97316" font-weight="bold">K8s</text>

    <!-- Connected nodes -->
    <circle cx="50" cy="50" r="25" fill="#0f3460" stroke="#334155" stroke-width="2"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Pod</text>

    <circle cx="190" cy="50" r="25" fill="#0f3460" stroke="#334155" stroke-width="2"/>
    <text x="190" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Node</text>

    <circle cx="50" cy="190" r="25" fill="#0f3460" stroke="#334155" stroke-width="2"/>
    <text x="50" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Svc</text>

    <circle cx="190" cy="190" r="25" fill="#0f3460" stroke="#334155" stroke-width="2"/>
    <text x="190" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Config</text>

    <!-- Connection lines -->
    <g stroke="#475569" stroke-width="2" stroke-dasharray="5,3">
      <line x1="120" y1="120" x2="50" y2="50"/>
      <line x1="120" y1="120" x2="190" y2="50"/>
      <line x1="120" y1="120" x2="50" y2="190"/>
      <line x1="120" y1="120" x2="190" y2="190"/>
    </g>
  </g>

  <!-- Main title area -->
  <g transform="translate(320, 350)">
    <!-- Decorative line -->
    <rect x="0" y="0" width="60" height="4" fill="url(#accentGrad)" rx="2"/>

    <!-- Title -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="42" fill="#f8fafc" font-weight="bold">运维排忧解难</text>

    <!-- Subtitle -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Operations Troubleshooting Guide</text>

    <!-- Tags -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#f97316" opacity="0.2" stroke="#f97316" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#f97316">运维</text>

      <rect x="115" y="0" width="100" height="32" rx="16" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="165" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ef4444">DevOps</text>
    </g>
  </g>

  <!-- Right side decorative elements -->
  <g transform="translate(950, 350)">
    <!-- Alert icon -->
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="65" text-anchor="middle" font-size="36" fill="#ef4444">!</text>

    <!-- Checklist -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Checklist</text>
      <line x1="15" y1="50" x2="85" y2="50" stroke="#475569" stroke-width="1"/>
      <circle cx="25" cy="70" r="5" fill="#22c55e"/>
      <text x="40" y="75" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Diagnose</text>
      <circle cx="25" cy="90" r="5" fill="#fbbf24"/>
      <text x="40" y="95" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Fix</text>
    </g>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#1e293b"/>
  <rect x="0" y="590" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>