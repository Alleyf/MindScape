<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="topicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(200, 315)">
    <path d="M-50,-100 L50,0 L-50,100" fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(400, 315)">
    <rect x="-150" y="-120" width="300" height="240" rx="10" fill="#1e293b" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.5"/>
    <g transform="translate(-100, -80)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="url(#topicGrad)" opacity="0.8"/>
      <text x="100" y="25" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Partition 0</text>
    </g>
    <g transform="translate(-100, -20)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="url(#topicGrad)" opacity="0.6"/>
      <text x="100" y="25" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Partition 1</text>
    </g>
    <g transform="translate(-100, 40)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="url(#topicGrad)" opacity="0.4"/>
      <text x="100" y="25" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Partition 2</text>
    </g>
  </g>
  <g transform="translate(80, 315)">
    <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Producer</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Push</text>
  </g>
  <g transform="translate(820, 315)">
    <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Consumer</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Pull</text>
  </g>
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.6">
    <line x1="130" y1="290" x2="240" y2="290"/>
    <line x1="130" y1="315" x2="240" y2="315"/>
    <line x1="130" y1="340" x2="240" y2="340"/>
    <line x1="560" y1="290" x2="770" y2="290"/>
    <line x1="560" y1="315" x2="770" y2="315"/>
    <line x1="560" y1="340" x2="770" y2="340"/>
  </g>
  <g fill="#8b5cf6">
    <circle cx="185" cy="290" r="6"/>
    <circle cx="185" cy="315" r="6"/>
    <circle cx="185" cy="340" r="6"/>
    <circle cx="665" cy="290" r="6"/>
    <circle cx="665" cy="315" r="6"/>
    <circle cx="665" cy="340" r="6"/>
  </g>
  <text x="600" y="560" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="42" font-weight="bold" letter-spacing="4">Kafka</text>
  <g transform="translate(600, 80)">
    <rect x="-100" y="-20" width="200" height="40" rx="20" fill="#8b5cf6" opacity="0.15"/>
    <text x="0" y="7" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="16">Distributed Message Queue</text>
  </g>
  <circle cx="1050" cy="150" r="60" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="500" r="50" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.2"/>
  <g transform="translate(1050, 480)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="12">Cluster</text>
  </g>
</svg>
