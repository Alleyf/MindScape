<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(350, 315)">
    <ellipse cx="0" cy="-80" rx="100" ry="30" fill="#f59e0b" opacity="0.3"/>
    <rect x="-100" y="-80" width="200" height="160" fill="#f59e0b" opacity="0.1"/>
    <ellipse cx="0" cy="80" rx="100" ry="30" fill="none" stroke="url(#orangeGrad)" stroke-width="3"/>
    <ellipse cx="0" cy="-80" rx="100" ry="30" fill="none" stroke="url(#orangeGrad)" stroke-width="3"/>
    <line x1="-100" y1="-80" x2="-100" y2="80" stroke="url(#orangeGrad)" stroke-width="2"/>
    <line x1="100" y1="-80" x2="100" y2="80" stroke="url(#orangeGrad)" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DATABASE</text>
  </g>
  <g transform="translate(600, 315)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10,5"/>
    <polygon points="180,0 160,-10 160,10" fill="#f59e0b"/>
  </g>
  <g transform="translate(600, 315)">
    <rect x="-120" y="-100" width="240" height="200" rx="15" fill="#1e293b" stroke="url(#orangeGrad)" stroke-width="3"/>
    <text x="0" y="-60" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14">&lt;mapper&gt;</text>
    <text x="-60" y="-25" text-anchor="start" fill="#fbbf24" font-family="monospace" font-size="12">SQL</text>
    <rect x="-80" y="-35" width="160" height="2" fill="#f59e0b" opacity="0.5"/>
    <text x="-80" y="0" text-anchor="start" fill="#64748b" font-family="monospace" font-size="11">SELECT *</text>
    <text x="-80" y="20" text-anchor="start" fill="#64748b" font-family="monospace" font-size="11">FROM users</text>
    <text x="-80" y="50" text-anchor="start" fill="#64748b" font-family="monospace" font-size="11">WHERE id = ?</text>
    <text x="0" y="80" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14">&lt;/mapper&gt;</text>
  </g>
  <g opacity="0.6">
    <text x="150" y="150" fill="#f59e0b" font-family="monospace" font-size="14">INSERT</text>
    <text x="950" y="180" fill="#fbbf24" font-family="monospace" font-size="14">UPDATE</text>
    <text x="100" y="480" fill="#fbbf24" font-family="monospace" font-size="14">DELETE</text>
    <text x="900" y="500" fill="#f59e0b" font-family="monospace" font-size="14">SELECT</text>
  </g>
  <text x="600" y="550" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="42" font-weight="bold" letter-spacing="4">MyBatis</text>
  <g transform="translate(600, 100)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#f59e0b" opacity="0.15"/>
    <text x="0" y="7" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14">SQL Mapper Framework</text>
  </g>
  <circle cx="100" cy="100" r="5" fill="#f59e0b" opacity="0.4"/>
  <circle cx="1100" cy="500" r="5" fill="#f59e0b" opacity="0.4"/>
</svg>
