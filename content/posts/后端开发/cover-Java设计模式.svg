  <text x="600" y="60" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="bold" letter-spacing="4">DESIGN PATTERNS</text>
  <circle cx="80" cy="500" r="50" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
