    <text x="0" y="18" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">Strategy</text>
    <text x="0" y="36" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">Command</text>
    <text x="0" y="54" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">State</text>
  </g>
  <g stroke="#334155" stroke-width="2" opacity="0.4">
