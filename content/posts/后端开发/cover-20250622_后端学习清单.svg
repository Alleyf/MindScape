<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Learning path visualization -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Path line -->
    <path d="M50 300 L150 200 L250 280 L350 180 L450 260" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodes -->
    <circle cx="50" cy="300" r="30" fill="url(#springGrad)" filter="url(#glow)"/>
    <text x="50" y="310" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Java</text>

    <circle cx="150" cy="200" r="30" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="150" y="210" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Spring</text>

    <circle cx="250" cy="280" r="30" fill="#10b981" filter="url(#glow)"/>
    <text x="250" y="290" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">MySQL</text>

    <circle cx="350" cy="180" r="30" fill="#8b5cf6" filter="url(#glow)"/>
    <text x="350" y="190" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Redis</text>

    <circle cx="450" cy="260" r="30" fill="#f59e0b" filter="url(#glow)"/>
    <text x="450" y="270" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">MQ</text>
  </g>

  <!-- Tech stack icons -->
  <g transform="translate(650, 120)">
    <!-- Java -->
    <rect x="0" y="0" width="100" height="100" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="55" text-anchor="middle" fill="#f59e0b" font-size="36" font-weight="bold" font-family="Arial">☕</text>
    <text x="50" y="95" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Java</text>

    <!-- Spring Boot -->
    <rect x="120" y="0" width="100" height="100" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="55" text-anchor="middle" fill="#10b981" font-size="36" font-family="Arial">⚙</text>
    <text x="170" y="95" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Spring</text>

    <!-- MySQL -->
    <rect x="240" y="0" width="100" height="100" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="290" y="55" text-anchor="middle" fill="#6366f1" font-size="36" font-family="Arial">🗄</text>
    <text x="290" y="95" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">MySQL</text>

    <!-- Redis -->
    <rect x="360" y="0" width="100" height="100" rx="15" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="410" y="55" text-anchor="middle" fill="#ef4444" font-size="36" font-family="Arial">⚡</text>
    <text x="410" y="95" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Redis</text>
  </g>

  <!-- Checklist items -->
  <g transform="translate(650, 250)">
    <rect x="0" y="0" width="450" height="280" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="225" y="40" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial">📋 学习清单</text>

    <g transform="translate(30, 70)">
      <circle cx="15" cy="15" r="10" fill="url(#springGrad)"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="20" fill="#e2e8f0" font-size="14" font-family="Arial">Java 基础编程</text>

      <circle cx="15" cy="55" r="10" fill="url(#accentGrad)"/>
      <text x="15" y="60" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="60" fill="#e2e8f0" font-size="14" font-family="Arial">Spring Boot 框架</text>

      <circle cx="15" cy="95" r="10" fill="#6366f1"/>
      <text x="15" y="100" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="100" fill="#e2e8f0" font-size="14" font-family="Arial">MySQL 数据库</text>

      <circle cx="15" cy="135" r="10" fill="#f59e0b"/>
      <text x="15" y="140" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="140" fill="#e2e8f0" font-size="14" font-family="Arial">MyBatis 持久层</text>

      <circle cx="15" cy="175" r="10" fill="#10b981"/>
      <text x="15" y="180" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="180" fill="#e2e8f0" font-size="14" font-family="Arial">Spring Cloud 微服务</text>

      <circle cx="15" cy="215" r="10" fill="#8b5cf6"/>
      <text x="15" y="220" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✓</text>
      <text x="40" y="220" fill="#e2e8f0" font-size="14" font-family="Arial">Linux &amp; JVM 进阶</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="1000" height="100" rx="20" fill="#1e293b" opacity="0.8"/>
    <text x="500" y="45" text-anchor="middle" fill="white" font-size="38" font-weight="bold" font-family="Arial, sans-serif">后端开发学习清单</text>
    <text x="500" y="80" text-anchor="middle" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">2025 后端工程师成长路线图 · 从入门到进阶</text>
  </g>

  <!-- Decorative code snippet -->
  <g transform="translate(100, 320)" opacity="0.7">
    <rect x="0" y="0" width="480" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" fill="#64748b" font-size="12" font-family="monospace">// Backend Learning Path</text>
    <text x="20" y="50" fill="#3b82f6" font-size="14" font-family="monospace">public class BackendDev {</text>
    <text x="40" y="75" fill="#10b981" font-size="14" font-family="monospace">  void learn() {</text>
    <text x="60" y="100" fill="#e2e8f0" font-size="13" font-family="monospace">java.learn(); spring.boot(); mysql.query();</text>
    <text x="40" y="125" fill="#10b981" font-size="14" font-family="monospace">  }</text>
    <text x="20" y="150" fill="#3b82f6" font-size="14" font-family="monospace">}</text>
  </g>
</svg>