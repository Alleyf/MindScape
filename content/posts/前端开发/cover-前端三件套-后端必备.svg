<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e34c26"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#264de4"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7df1e"/>
      <stop offset="100%" style="stop-color:#fef08a"/>
    </linearGradient>
    <linearGradient id="vueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42b883"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative code background -->
  <g opacity="0.03" font-family="monospace" font-size="14" fill="#64748b">
    <text x="50" y="100">&lt;div class="container"&gt;</text>
    <text x="70" y="130">  &lt;style&gt; .btn { color: #e34c26; } &lt;/style&gt;</text>
    <text x="70" y="160">  &lt;script&gt; const x = () =&gt; {} &lt;/script&gt;</text>
    <text x="50" y="190">&lt;/div&gt;</text>
  </g>

  <!-- HTML/CSS/JS Icons -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- HTML5 -->
    <g transform="translate(0, 0)">
      <polygon points="100,10 190,30 170,200 100,220 30,200" fill="url(#htmlGrad)" filter="url(#glow)"/>
      <polygon points="100,25 175,42 160,175 100,190" fill="#fff8ee"/>
      <text x="100" y="130" text-anchor="middle" fill="#e34c26" font-size="60" font-weight="bold" font-family="Arial">5</text>
      <text x="100" y="250" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial">HTML</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(140, 0)">
      <polygon points="100,10 190,30 170,200 100,220 30,200" fill="url(#cssGrad)" filter="url(#glow)"/>
      <polygon points="100,25 175,42 160,175 100,190" fill="#fff8ee"/>
      <text x="100" y="130" text-anchor="middle" fill="#264de4" font-size="60" font-weight="bold" font-family="Arial">3</text>
      <text x="100" y="250" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial">CSS</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(280, 0)">
      <rect x="10" y="10" width="180" height="200" rx="15" fill="#282828" stroke="url(#jsGrad)" stroke-width="3"/>
      <text x="100" y="90" text-anchor="middle" fill="url(#jsGrad)" font-size="70" font-weight="bold" font-family="Arial">JS</text>
      <text x="100" y="130" text-anchor="middle" fill="#64748b" font-size="18" font-family="Arial">JavaScript</text>
      <text x="100" y="240" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial">JS</text>
    </g>
  </g>

  <!-- Vue.js Logo -->
  <g transform="translate(520, 100)" filter="url(#shadow)">
    <g transform="translate(0, 20)">
      <!-- Vue logo -->
      <polygon points="100,10 170,50 170,150 100,190 30,150 30,50" fill="url(#vueGrad)" filter="url(#glow)"/>
      <polygon points="100,40 140,65 140,135 100,160 60,135 60,65" fill="#1e293b"/>
      <polygon points="100,70 115,80 115,130 100,140 85,130 85,80" fill="url(#vueGrad)"/>
      <polygon points="100,70 85,80 85,130 100,140" fill="#1e293b"/>
    </g>
    <text x="100" y="240" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Arial">Vue.js</text>
  </g>

  <!-- Code snippet panel -->
  <g transform="translate(720, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="280" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="40" rx="15" fill="#0f172a"/>
    <circle cx="20" cy="20" r="8" fill="#ef4444"/>
    <circle cx="42" cy="20" r="8" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="8" fill="#10b981"/>
    <text x="190" y="26" text-anchor="middle" fill="#64748b" font-size="12" font-family="monospace">frontend essentials</text>

    <g transform="translate(20, 60)" font-family="monospace" font-size="13">
      <text x="0" y="0" fill="#64748b">// HTML Structure</text>
      <text x="0" y="25" fill="#e34c26">&lt;div</text> <text x="70" y="25" fill="#94a3b8">class</text> <text x="130" y="25" fill="#e34c26">="app"</text><text x="190" y="25" fill="#e34c26">&gt;</text>
      <text x="20" y="50" fill="#264de4">  &lt;style&gt;</text>
      <text x="40" y="75" fill="#f7df1e">    .btn { color: #e34c26; }</text>
      <text x="20" y="100" fill="#264de4">  &lt;/style&gt;</text>
      <text x="20" y="125" fill="#264de4">  &lt;script</text> <text x="100" y="125" fill="#94a3b8">type</text> <text x="160" y="125" fill="#e34c26">="module"</text><text x="220" y="125" fill="#264de4">&gt;</text>
      <text x="40" y="150" fill="#f7df1e">    import { ref } from "vue";</text>
      <text x="40" y="175" fill="#f7df1e">    const count = ref(0);</text>
      <text x="20" y="200" fill="#264de4">  &lt;/script&gt;</text>
      <text x="0" y="225" fill="#e34c26">&lt;/div&gt;</text>
    </g>
  </g>

  <!-- Key concepts -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="1000" height="100" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="500" y="35" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">📚 核心知识点</text>

    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="180" height="35" rx="18" fill="url(#htmlGrad)" opacity="0.2"/>
      <text x="90" y="23" text-anchor="middle" fill="#e34c26" font-size="13" font-family="Arial">DOM 操作</text>

      <rect x="200" y="0" width="180" height="35" rx="18" fill="url(#cssGrad)" opacity="0.2"/>
      <text x="290" y="23" text-anchor="middle" fill="#264de4" font-size="13" font-family="Arial">CSS 布局</text>

      <rect x="400" y="0" width="180" height="35" rx="18" fill="url(#jsGrad)" opacity="0.2"/>
      <text x="490" y="23" text-anchor="middle" fill="#a16207" font-size="13" font-weight="bold" font-family="Arial">ES6+ 语法</text>

      <rect x="600" y="0" width="180" height="35" rx="18" fill="url(#vueGrad)" opacity="0.2"/>
      <text x="690" y="23" text-anchor="middle" fill="#42b883" font-size="13" font-family="Arial">Vue 3 组合式</text>

      <rect x="800" y="0" width="180" height="35" rx="18" fill="#8b5cf6" opacity="0.2"/>
      <text x="890" y="23" text-anchor="middle" fill="#8b5cf6" font-size="13" font-family="Arial">Axios 请求</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="1000" height="70" rx="20" fill="#1e293b" opacity="0.8"/>
    <text x="500" y="32" text-anchor="middle" fill="white" font-size="32" font-weight="bold" font-family="Arial, sans-serif">前端三件套 · 后端必备</text>
    <text x="500" y="55" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial, sans-serif">HTML · CSS · JavaScript · Vue · 后端程序员的前端入门指南</text>
  </g>
</svg>