<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1207"/>
      <stop offset="100%" style="stop-color:#2d1f0f"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <g fill="#f97316" fill-opacity="0.03">
    <rect x="0" y="0" width="100" height="100"/><rect x="100" y="100" width="100" height="100"/><rect x="200" y="200" width="100" height="100"/>
    <rect x="300" y="300" width="100" height="100"/><rect x="400" y="400" width="100" height="100"/><rect x="500" y="500" width="100" height="100"/>
    <rect x="600" y="100" width="100" height="100"/><rect x="700" y="200" width="100" height="100"/><rect x="800" y="300" width="100" height="100"/>
    <rect x="900" y="400" width="100" height="100"/><rect x="1000" y="500" width="100" height="100"/><rect x="1100" y="0" width="100" height="100"/>
  </g>
  <g transform="translate(600, 250)">
    <rect x="-200" y="-80" width="400" height="160" rx="15" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="2"/>
    <g font-family="monospace" font-size="36" font-weight="bold">
      <text x="-150" y="20" fill="#f97316">^</text>
      <text x="-100" y="20" fill="#fbbf24">[a-z</text>
      <text x="10" y="20" fill="#ffffff">A-Z</text>
      <text x="100" y="20" fill="#fbbf24">0-9]</text>
      <text x="170" y="20" fill="#f97316">+$</text>
    </g>
    <g font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.5">
      <text x="-150" y="50" text-anchor="middle">start</text>
      <text x="170" y="50" text-anchor="middle">end</text>
    </g>
  </g>
  <g transform="translate(150, 480)">
    <g font-family="monospace" font-size="16">
      <text x="0" y="0" fill="#f97316">\d</text>
      <text x="50" y="0" fill="#ffffff" fill-opacity="0.6">digit [0-9]</text>
    </g>
    <g font-family="monospace" font-size="16">
      <text x="0" y="30" fill="#f97316">\w</text>
      <text x="50" y="30" fill="#ffffff" fill-opacity="0.6">word [a-zA-Z0-9_]</text>
    </g>
    <g font-family="monospace" font-size="16">
      <text x="0" y="60" fill="#f97316">\s</text>
      <text x="50" y="60" fill="#ffffff" fill-opacity="0.6">whitespace</text>
    </g>
  </g>
  <g transform="translate(500, 480)">
    <g font-family="monospace" font-size="16">
      <text x="0" y="0" fill="#fbbf24">*</text>
      <text x="30" y="0" fill="#ffffff" fill-opacity="0.6">0 or more</text>
    </g>
    <g font-family="monospace" font-size="16">
      <text x="0" y="30" fill="#fbbf24">+</text>
      <text x="30" y="30" fill="#ffffff" fill-opacity="0.6">1 or more</text>
    </g>
    <g font-family="monospace" font-size="16">
      <text x="0" y="60" fill="#fbbf24">?</text>
      <text x="30" y="60" fill="#ffffff" fill-opacity="0.6">0 or 1</text>
    </g>
    <g font-family="monospace" font-size="16">
      <text x="0" y="90" fill="#fbbf24">{'{n,m}'}</text>
      <text x="80" y="90" fill="#ffffff" fill-opacity="0.6">n to m times</text>
    </g>
  </g>
  <g transform="translate(900, 450)">
    <rect x="-80" y="-40" width="160" height="80" rx="8" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="0" y="-15" fill="#f97316" font-family="monospace" font-size="14" text-anchor="middle">capturing</text>
    <text x="0" y="15" fill="#fbbf24" font-family="monospace" font-size="24" text-anchor="middle">(expr)</text>
    <text x="0" y="45" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="12" text-anchor="middle">group</text>
  </g>
  <g font-family="monospace" font-size="48" fill="#f97316" fill-opacity="0.15">
    <text x="80" y="120">.*</text>
    <text x="950" y="150">\b</text>
    <text x="100" y="380">[ ]</text>
  </g>
  <text x="600" y="520" fill="url(#grad3)" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle">正则表达式</text>
  <text x="600" y="570" fill="#ffffff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Regular Expression</text>
  <rect x="500" y="590" width="200" height="3" fill="url(#grad3)" rx="1.5"/>
</svg>
