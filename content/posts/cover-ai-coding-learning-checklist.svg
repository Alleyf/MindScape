<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a3c"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#4c4a85" opacity="0.4">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/>
    <circle cx="1050" cy="530" r="2"/><circle cx="1100" cy="530" r="2"/><circle cx="1150" cy="530" r="2"/>
    <circle cx="1050" cy="580" r="2"/><circle cx="1100" cy="580" r="2"/><circle cx="1150" cy="580" r="2"/>
  </g>

  <polygon points="100,150 150,100 200,150" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  <circle cx="1050" cy="120" r="40" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
  <rect x="80" y="450" width="60" height="60" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.3" transform="rotate(15 110 480)"/>

  <g transform="translate(200, 315)">
    <path d="M-100,0 Q100,-80 300,0 T700,0" fill="none" stroke="url(#accent1)" stroke-width="3" opacity="0.6"/>

    <circle cx="0" cy="0" r="45" fill="#1e1b4b" stroke="url(#accent1)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CONCEPT</text>

    <circle cx="200" cy="-60" r="45" fill="#1e1b4b" stroke="url(#accent2)" stroke-width="3" filter="url(#glow)"/>
    <text x="200" y="-55" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TOOLS</text>

    <circle cx="400" cy="0" r="45" fill="#1e1b4b" stroke="url(#accent3)" stroke-width="3" filter="url(#glow)"/>
    <text x="400" y="-55" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">WORK</text>
    <text x="400" y="-42" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">FLOW</text>

    <circle cx="600" cy="-60" r="45" fill="#1e1b4b" stroke="url(#accent1)" stroke-width="3" filter="url(#glow)"/>
    <text x="600" y="-55" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">METHODS</text>

    <circle cx="800" cy="0" r="45" fill="#1e1b4b" stroke="url(#accent2)" stroke-width="3" filter="url(#glow)"/>
    <text x="800" y="5" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SKILLS</text>
  </g>

  <g transform="translate(950, 80)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#accent2)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="35" fill="#1e1b4b" stroke="url(#accent2)" stroke-width="2"/>
    <path d="M-15,-10 L-15,15 L0,5 L15,15 L15,-10 L0,0 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="-8" cy="-5" r="3" fill="#22d3ee"/>
    <circle cx="8" cy="-5" r="3" fill="#22d3ee"/>
  </g>

  <g transform="translate(120, 500)" opacity="0.6">
    <text font-family="monospace" font-size="60" fill="#6366f1">&lt;/&gt;</text>
  </g>

  <text x="600" y="550" text-anchor="middle" fill="#fff8ee" font-family="Arial, sans-serif" font-size="42" font-weight="bold" letter-spacing="2">
    AI CODING
  </text>
  <text x="600" y="595" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="24" letter-spacing="4">
    LEARNING CHECKLIST
  </text>
</svg>
