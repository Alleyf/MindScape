<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#8b5cf6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- LLM architecture visualization -->
  <g filter="url(#glow)">
    <!-- Input layer -->
    <g transform="translate(100, 200)">
      <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="60" y="35" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Input</text>
      <text x="60" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">输入层</text>
    </g>

    <!-- Embedding -->
    <g transform="translate(280, 200)">
      <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <text x="60" y="35" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Embedding</text>
      <text x="60" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#8b5cf6">嵌入层</text>
    </g>

    <!-- Transformer blocks -->
    <g transform="translate(460, 180)">
      <rect x="0" y="0" width="100" height="120" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Transformer</text>
      <text x="50" y="50" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#06b6d4">Block 1</text>
      <rect x="120" y="0" width="100" height="120" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="170" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Transformer</text>
      <text x="170" y="50" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#06b6d4">Block 2</text>
      <rect x="240" y="0" width="100" height="120" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="290" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Transformer</text>
      <text x="290" y="50" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#06b6d4">Block N</text>
    </g>

    <!-- Attention mechanism -->
    <g transform="translate(820, 160)">
      <circle cx="60" cy="40" r="50" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="60" cy="40" r="35" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="60" cy="40" r="20" fill="none" stroke="#06b6d4" stroke-width="1"/>
      <line x1="60" y1="40" x2="15" y2="40" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="60" y1="40" x2="105" y2="40" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="60" y1="40" x2="60" y2="5" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="60" y1="40" x2="60" y2="75" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="60" y="100" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Attention</text>
      <text x="60" y="118" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#06b6d4">自注意力</text>
    </g>

    <!-- Output -->
    <g transform="translate(980, 200)">
      <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <text x="60" y="35" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Output</text>
      <text x="60" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#8b5cf6">输出层</text>
    </g>

    <!-- Connecting arrows -->
    <polygon points="225,240 245,230 245,250" fill="#06b6d4"/>
    <polygon points="405,240 425,230 425,250" fill="#06b6d4"/>
    <polygon points="775,240 795,230 795,250" fill="#06b6d4"/>
    <polygon points="935,240 960,240 950,255" fill="#06b6d4"/>
  </g>

  <!-- Legal/Judicial theme elements -->
  <g transform="translate(300, 420)" filter="url(#glow)">
    <!-- Scales of justice -->
    <line x1="60" y1="0" x2="60" y2="60" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="20" y1="20" x2="100" y2="20" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="20,20 10,40 30,40" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="100,20 90,40 110,40" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">司法领域</text>
  </g>

  <!-- Knowledge graph nodes -->
  <g transform="translate(600, 430)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="70" cy="20" r="25" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-60" cy="30" r="20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="50" cy="-35" r="18" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="0" y1="0" x2="70" y2="20" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="0" x2="-60" y2="30" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="0" x2="50" y2="-35" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="70" y1="20" x2="50" y2="-35" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="70" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">Knowledge Graph</text>
  </g>

  <!-- Title text -->
  <text x="600" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" fill="#e0e0ff" font-weight="bold" letter-spacing="4">司法领域大模型调研</text>
  <text x="600" y="160" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#06b6d4" letter-spacing="2">Judicial LLM Survey Report</text>

  <!-- Decorative elements -->
  <g stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#06b6d4" opacity="0.6">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="1050" cy="500" r="3"/>
    <circle cx="800" cy="100" r="2"/>
  </g>
</svg>