<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#8b5cf6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Flow diagram - reading pipeline -->
  <g filter="url(#glow)">
    <!-- Box 1: Abstract -->
    <rect x="100" y="250" width="140" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="285" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Abstract</text>
    <text x="170" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">摘要</text>

    <!-- Arrow 1 -->
    <polygon points="245,290 260,280 260,300" fill="#06b6d4"/>

    <!-- Box 2: Intro -->
    <rect x="270" y="250" width="140" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="340" y="285" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Introduction</text>
    <text x="340" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">引言</text>

    <!-- Arrow 2 -->
    <polygon points="415,290 430,280 430,300" fill="#06b6d4"/>

    <!-- Box 3: Methods -->
    <rect x="440" y="250" width="140" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="510" y="285" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Methods</text>
    <text x="510" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">方法</text>

    <!-- Arrow 3 -->
    <polygon points="585,290 600,280 600,300" fill="#06b6d4"/>

    <!-- Box 4: Results -->
    <rect x="610" y="250" width="140" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="680" y="285" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Results</text>
    <text x="680" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">结果</text>

    <!-- Arrow 4 -->
    <polygon points="755,290 770,280 770,300" fill="#06b6d4"/>

    <!-- Box 5: Conclusion -->
    <rect x="780" y="250" width="140" height="80" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="850" y="285" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Conclusion</text>
    <text x="850" y="310" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#8b5cf6">结论</text>
  </g>

  <!-- Knowledge graph nodes -->
  <g transform="translate(300, 480)" filter="url(#glow)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="80" cy="30" r="30" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-70" cy="40" r="25" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="60" cy="-40" r="20" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="0" y1="0" x2="80" y2="30" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="0" x2="-70" y2="40" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="0" x2="60" y2="-40" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="80" y1="30" x2="60" y2="-40" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Stack of papers on right -->
  <g transform="translate(920, 380)">
    <rect x="0" y="0" width="100" height="140" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2" transform="translate(-3, -3)"/>
    <rect x="0" y="0" width="100" height="140" rx="4" fill="none" stroke="#06b6d4" stroke-width="2" transform="translate(0, 0)"/>
    <rect x="0" y="0" width="100" height="140" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2" transform="translate(3, 3)"/>
    <line x1="15" y1="25" x2="85" y2="25" stroke="#e0e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="15" y1="40" x2="75" y2="40" stroke="#e0e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="15" y1="55" x2="80" y2="55" stroke="#e0e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="15" y1="70" x2="70" y2="70" stroke="#e0e0ff" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="15" y1="85" x2="75" y2="85" stroke="#e0e0ff" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- Title text -->
  <text x="600" y="180" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" fill="#e0e0ff" font-weight="bold" letter-spacing="4">Paper Reading Method</text>
  <text x="600" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#06b6d4" letter-spacing="2">论文阅读方法</text>

  <!-- Decorative elements -->
  <g stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#06b6d4" opacity="0.6">
    <circle cx="150" cy="100" r="3"/>
    <circle cx="950" cy="150" r="4"/>
    <circle cx="200" cy="550" r="2"/>
    <circle cx="1000" cy="500" r="3"/>
    <circle cx="700" cy="120" r="2"/>
  </g>
</svg>