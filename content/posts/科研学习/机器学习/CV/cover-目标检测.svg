<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="yoloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="detectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#f97316" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Detection visualization -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <!-- Simulated image with detection boxes -->
    <rect x="0" y="0" width="500" height="350" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Background gradient -->
    <rect x="5" y="5" width="490" height="340" rx="10" fill="url(#bgGrad)"/>

    <!-- Simulated scene elements -->
    <!-- Person 1 -->
    <ellipse cx="150" cy="80" rx="25" ry="20" fill="#64748b"/>
    <rect x="130" y="100" width="40" height="80" rx="10" fill="#64748b"/>
    <rect x="120" y="185" width="20" height="60" rx="5" fill="#64748b"/>
    <rect x="160" y="185" width="20" height="60" rx="5" fill="#64748b"/>

    <!-- Person 2 -->
    <ellipse cx="300" cy="70" rx="22" ry="18" fill="#94a3b8"/>
    <rect x="282" y="88" width="36" height="70" rx="8" fill="#94a3b8"/>
    <rect x="275" y="160" width="18" height="50" rx="4" fill="#94a3b8"/>
    <rect x="307" y="160" width="18" height="50" rx="4" fill="#94a3b8"/>

    <!-- Car -->
    <rect x="380" y="150" width="80" height="40" rx="5" fill="#475569"/>
    <rect x="390" y="120" width="60" height="35" rx="3" fill="#475569"/>
    <circle cx="400" cy="195" r="12" fill="#334155"/>
    <circle cx="450" cy="195" r="12" fill="#334155"/>

    <!-- Detection boxes -->
    <!-- Person 1 box -->
    <rect x="110" y="50" width="100" height="200" rx="8" fill="none" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
    <rect x="110" y="50" width="100" height="22" rx="8" fill="#ef4444"/>
    <text x="160" y="66" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">person 0.95</text>

    <!-- Person 2 box -->
    <rect x="260" y="40" width="90" height="180" rx="8" fill="none" stroke="#10b981" stroke-width="3" filter="url(#glow)"/>
    <rect x="260" y="40" width="90" height="22" rx="8" fill="#10b981"/>
    <text x="305" y="56" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">person 0.89</text>

    <!-- Car box -->
    <rect x="370" y="110" width="100" height="100" rx="8" fill="none" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="370" y="110" width="100" height="22" rx="8" fill="#3b82f6"/>
    <text x="420" y="126" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">car 0.92</text>

    <!-- YOLO grid overlay -->
    <g opacity="0.3">
      <line x1="0" y1="116" x2="500" y2="116" stroke="#f97316" stroke-width="1"/>
      <line x1="0" y1="233" x2="500" y2="233" stroke="#f97316" stroke-width="1"/>
      <line x1="166" y1="0" x2="166" y2="350" stroke="#f97316" stroke-width="1"/>
      <line x1="333" y1="0" x2="333" y2="350" stroke="#f97316" stroke-width="1"/>
    </g>
  </g>

  <!-- YOLO Architecture -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="500" height="350" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="250" y="40" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Arial">YOLO Architecture</text>

    <!-- Input -->
    <rect x="175" y="70" width="100" height="50" rx="8" fill="url(#yoloGrad)" filter="url(#glow)"/>
    <text x="225" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Input 416×416</text>

    <!-- Backbone -->
    <rect x="150" y="150" width="150" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="225" y="175" text-anchor="middle" fill="#f97316" font-size="14" font-weight="bold" font-family="Arial">Backbone (CSPDarknet)</text>
    <text x="225" y="195" text-anchor="middle" fill="#64748b" font-size="11" font-family="Arial">Feature Extraction</text>

    <!-- Neck -->
    <rect x="150" y="240" width="150" height="60" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="225" y="265" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold" font-family="Arial">Neck (PANet)</text>
    <text x="225" y="285" text-anchor="middle" fill="#64748b" font-size="11" font-family="Arial">Feature Fusion</text>

    <!-- Head -->
    <rect x="150" y="330" width="150" height="50" rx="8" fill="url(#detectionGrad)" filter="url(#glow)"/>
    <text x="225" y="360" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Head (Detection)</text>

    <!-- Connections -->
    <line x1="225" y1="120" x2="225" y2="150" stroke="#64748b" stroke-width="2"/>
    <line x1="225" y1="210" x2="225" y2="240" stroke="#64748b" stroke-width="2"/>
    <line x1="225" y1="300" x2="225" y2="330" stroke="#64748b" stroke-width="2"/>

    <!-- Output predictions -->
    <g transform="translate(330, 160)">
      <rect x="0" y="0" width="150" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="75" y="25" text-anchor="middle" fill="#64748b" font-size="12" font-family="Arial">Predictions</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="120" height="35" rx="6" fill="#ef4444" opacity="0.2"/>
        <text x="60" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-family="Arial">Person × 2</text>

        <rect x="0" y="50" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.2"/>
        <text x="60" y="72" text-anchor="middle" fill="#3b82f6" font-size="11" font-family="Arial">Car × 1</text>

        <rect x="0" y="100" width="120" height="35" rx="6" fill="#10b981" opacity="0.2"/>
        <text x="60" y="122" text-anchor="middle" fill="#10b981" font-size="11" font-family="Arial">Bboxes: [x,y,w,h]</text>
      </g>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="1040" height="100" rx="20" fill="#1e293b" opacity="0.8"/>
    <text x="520" y="45" text-anchor="middle" fill="white" font-size="38" font-weight="bold" font-family="Arial, sans-serif">Object Detection · 目标检测</text>
    <text x="520" y="78" text-anchor="middle" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">YOLO算法 · 实时目标检测 · 边界框预测</text>
  </g>

  <!-- Tags -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#yoloGrad)"/>
    <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">YOLO</text>
    <rect x="115" y="0" width="100" height="35" rx="18" fill="url(#detectionGrad)"/>
    <text x="165" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">目标检测</text>
    <rect x="230" y="0" width="80" height="35" rx="18" fill="#3b82f6"/>
    <text x="270" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">CV</text>
  </g>
</svg>