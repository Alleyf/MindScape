<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#8b5cf6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- CNN visualization - Conv layers -->
  <g filter="url(#glow)">
    <!-- Input image grid -->
    <g transform="translate(100, 180)">
      <rect x="0" y="0" width="100" height="100" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <g stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1">
        <line x1="20" y1="0" x2="20" y2="100"/>
        <line x1="40" y1="0" x2="40" y2="100"/>
        <line x1="60" y1="0" x2="60" y2="100"/>
        <line x1="80" y1="0" x2="80" y2="100"/>
        <line x1="0" y1="20" x2="100" y2="20"/>
        <line x1="0" y1="40" x2="100" y2="40"/>
        <line x1="0" y1="60" x2="100" y2="60"/>
        <line x1="0" y1="80" x2="100" y2="80"/>
      </g>
      <text x="50" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">Input</text>
    </g>

    <!-- Convolution filters -->
    <g transform="translate(280, 180)">
      <rect x="0" y="0" width="60" height="60" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="10" y="10" width="40" height="40" fill="none" stroke="#06b6d4" stroke-width="1"/>
      <text x="30" y="80" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">Conv</text>
    </g>

    <!-- Arrow -->
    <polygon points="230,230 250,220 250,240" fill="#06b6d4"/>

    <!-- Feature maps -->
    <g transform="translate(400, 160)">
      <rect x="0" y="0" width="70" height="70" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="80" y="0" width="70" height="70" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="160" y="0" width="70" height="70" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <text x="100" y="90" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">Feature Maps</text>
    </g>

    <!-- Arrow -->
    <polygon points="380,215 400,205 400,225" fill="#06b6d4"/>

    <!-- Pooling -->
    <g transform="translate(620, 180)">
      <rect x="0" y="0" width="80" height="80" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <text x="40" y="35" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#e0e0ff">Pooling</text>
      <text x="40" y="55" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#8b5cf6">池化</text>
    </g>

    <!-- Arrow -->
    <polygon points="580,220 600,210 600,230" fill="#06b6d4"/>

    <!-- FC layers -->
    <g transform="translate(760, 180)">
      <circle cx="30" cy="30" r="20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="80" cy="20" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="80" cy="50" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="130" cy="30" r="18" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="30" y1="30" x2="80" y2="20" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="30" y1="30" x2="80" y2="50" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="80" y1="20" x2="130" y2="30" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="80" y1="50" x2="130" y2="30" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="70" y="80" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#06b6d4">Fully Connected</text>
    </g>

    <!-- Arrow -->
    <polygon points="710,220 730,210 730,230" fill="#06b6d4"/>

    <!-- Output -->
    <g transform="translate(920, 170)">
      <rect x="0" y="0" width="100" height="100" rx="12" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <text x="50" y="45" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#e0e0ff" font-weight="bold">Class</text>
      <text x="50" y="65" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#8b5cf6">分类</text>
      <text x="50" y="85" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#06b6d4">Softmax</text>
    </g>
  </g>

  <!-- CNN architecture diagram at bottom -->
  <g transform="translate(200, 420)">
    <!-- Layer boxes -->
    <rect x="0" y="0" width="100" height="50" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="50" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Conv</text>

    <rect x="120" y="0" width="100" height="50" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="170" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">ReLU</text>

    <rect x="240" y="0" width="100" height="50" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="290" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Pool</text>

    <rect x="360" y="0" width="100" height="50" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="410" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Conv</text>

    <rect x="480" y="0" width="100" height="50" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="530" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">FC</text>

    <rect x="600" y="0" width="100" height="50" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="650" y="32" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#e0e0ff">Output</text>

    <!-- Connecting lines -->
    <line x1="100" y1="25" x2="120" y2="25" stroke="#06b6d4" stroke-width="2"/>
    <line x1="220" y1="25" x2="240" y2="25" stroke="#06b6d4" stroke-width="2"/>
    <line x1="340" y1="25" x2="360" y2="25" stroke="#06b6d4" stroke-width="2"/>
    <line x1="460" y1="25" x2="480" y2="25" stroke="#06b6d4" stroke-width="2"/>
    <line x1="580" y1="25" x2="600" y2="25" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Title text -->
  <text x="600" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="36" fill="#e0e0ff" font-weight="bold" letter-spacing="4">图像分类</text>
  <text x="600" y="160" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#06b6d4" letter-spacing="2">Image Classification</text>

  <!-- Decorative elements -->
  <g stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2">
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="1160" y1="40" x2="1120" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="80"/>
    <line x1="40" y1="590" x2="40" y2="550"/>
    <line x1="40" y1="590" x2="80" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="550"/>
    <line x1="1160" y1="590" x2="1120" y2="590"/>
  </g>

  <!-- Floating particles -->
  <g fill="#06b6d4" opacity="0.6">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="1050" cy="500" r="3"/>
    <circle cx="800" cy="100" r="2"/>
  </g>
</svg>