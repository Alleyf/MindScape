<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="cnnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- CNN Architecture Visualization -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <!-- Input Layer -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="80" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="10" y="10" width="60" height="80" rx="4" fill="#0f0f23"/>
      <!-- Image representation -->
      <rect x="15" y="15" width="50" height="30" fill="#3b82f6" opacity="0.6"/>
      <rect x="15" y="50" width="50" height="35" fill="#10b981" opacity="0.6"/>
      <text x="40" y="140" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Input</text>
      <text x="40" y="158" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">[N,C,H,W]</text>
    </g>

    <!-- Conv Layer 1 -->
    <g transform="translate(140, 60)">
      <rect x="0" y="0" width="80" height="160" rx="8" fill="#1e293b" stroke="url(#cnnGrad)" stroke-width="2"/>
      <rect x="10" y="10" width="60" height="100" rx="4" fill="#1a1a3e"/>
      <rect x="15" y="15" width="50" height="20" fill="#8b5cf6" opacity="0.8"/>
      <rect x="15" y="40" width="50" height="20" fill="#a78bfa" opacity="0.6"/>
      <rect x="15" y="65" width="50" height="20" fill="#c4b5fd" opacity="0.4"/>
      <text x="40" y="175" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Conv1</text>
      <text x="40" y="193" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">3×3 kernel</text>
    </g>

    <!-- Pool Layer -->
    <g transform="translate(280, 90)">
      <rect x="0" y="0" width="80" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="10" y="10" width="60" height="60" rx="4" fill="#1a1a3e"/>
      <rect x="15" y="15" width="50" height="25" fill="#f59e0b" opacity="0.8"/>
      <rect x="15" y="45" width="50" height="15" fill="#fbbf24" opacity="0.6"/>
      <text x="40" y="115" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Pool</text>
      <text x="40" y="133" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">2×2 max</text>
    </g>

    <!-- Conv Layer 2 -->
    <g transform="translate(420, 50)">
      <rect x="0" y="0" width="80" height="180" rx="8" fill="#1e293b" stroke="url(#cnnGrad)" stroke-width="2"/>
      <rect x="10" y="10" width="60" height="120" rx="4" fill="#1a1a3e"/>
      <rect x="15" y="15" width="50" height="18" fill="#8b5cf6" opacity="0.9"/>
      <rect x="15" y="38" width="50" height="18" fill="#a78bfa" opacity="0.7"/>
      <rect x="15" y="61" width="50" height="18" fill="#c4b5fd" opacity="0.5"/>
      <rect x="15" y="84" width="50" height="18" fill="#ddd6fe" opacity="0.3"/>
      <text x="40" y="200" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">Conv2</text>
      <text x="40" y="218" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">5×5 kernel</text>
    </g>

    <!-- FC Layer -->
    <g transform="translate(560, 90)">
      <rect x="0" y="0" width="80" height="100" rx="8" fill="#1e293b" stroke="url(#neuralGrad)" stroke-width="2"/>
      <circle cx="40" cy="30" r="15" fill="url(#neuralGrad)" filter="url(#glow)"/>
      <circle cx="25" cy="60" r="12" fill="url(#neuralGrad)" opacity="0.8"/>
      <circle cx="55" cy="60" r="12" fill="url(#neuralGrad)" opacity="0.8"/>
      <text x="40" y="115" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Arial">FC</text>
      <text x="40" y="133" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">Dense</text>
    </g>

    <!-- Connections -->
    <line x1="80" y1="140" x2="140" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="220" y1="140" x2="280" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="360" y1="140" x2="420" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="500" y1="140" x2="560" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  </g>

  <!-- Convolution Operation Diagram -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="420" height="260" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="210" y="35" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Arial">Convolution Operation</text>

    <!-- Input matrix -->
    <g transform="translate(30, 60)">
      <text x="40" y="0" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">Input</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="30" height="30" rx="3" fill="#3b82f6"/>
        <rect x="35" y="0" width="30" height="30" rx="3" fill="#6366f1"/>
        <rect x="70" y="0" width="30" height="30" rx="3" fill="#8b5cf6"/>
        <rect x="0" y="35" width="30" height="30" rx="3" fill="#6366f1"/>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="#8b5cf6"/>
        <rect x="70" y="35" width="30" height="30" rx="3" fill="#a78bfa"/>
        <rect x="0" y="70" width="30" height="30" rx="3" fill="#8b5cf6"/>
        <rect x="35" y="70" width="30" height="30" rx="3" fill="#a78bfa"/>
        <rect x="70" y="70" width="30" height="30" rx="3" fill="#c4b5fd"/>
      </g>
    </g>

    <!-- Arrow -->
    <path d="M140 105 L170 105" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <polygon points="170,100 180,105 170,110" fill="#64748b"/>

    <!-- Kernel -->
    <g transform="translate(190, 60)">
      <text x="40" y="0" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">Kernel</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="30" height="30" rx="3" fill="#10b981"/>
        <rect x="35" y="0" width="30" height="30" rx="3" fill="#34d399"/>
        <rect x="0" y="35" width="30" height="30" rx="3" fill="#34d399"/>
        <rect x="35" y="35" width="30" height="30" rx="3" fill="#6ee7b7"/>
      </g>
    </g>

    <!-- Output -->
    <g transform="translate(300, 75)">
      <text x="30" y="0" text-anchor="middle" fill="#64748b" font-size="10" font-family="Arial">Output</text>
      <rect x="0" y="15" width="60" height="60" rx="6" fill="#10b981" opacity="0.3"/>
      <rect x="10" y="25" width="40" height="40" rx="4" fill="url(#featureGrad)"/>
    </g>

    <!-- Formula -->
    <text x="210" y="230" text-anchor="middle" fill="#64748b" font-size="12" font-family="monospace">H_out = (H + 2p - k) / s + 1</text>
  </g>

  <!-- Title -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="1040" height="120" rx="20" fill="#1e293b" opacity="0.8"/>
    <text x="520" y="50" text-anchor="middle" fill="white" font-size="38" font-weight="bold" font-family="Arial, sans-serif">CNN · Convolutional Neural Networks</text>
    <text x="520" y="85" text-anchor="middle" fill="#94a3b8" font-size="20" font-family="Arial, sans-serif">卷积神经网络基础 · 卷积 · 池化 · 激活函数 · BatchNorm</text>
  </g>

  <!-- Tags -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="100" height="35" rx="18" fill="url(#cnnGrad)"/>
    <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">机器学习</text>
    <rect x="115" y="0" width="80" height="35" rx="18" fill="url(#neuralGrad)"/>
    <text x="155" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">深度学习</text>
    <rect x="210" y="0" width="60" height="35" rx="18" fill="#10b981"/>
    <text x="240" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">CV</text>
  </g>
</svg>