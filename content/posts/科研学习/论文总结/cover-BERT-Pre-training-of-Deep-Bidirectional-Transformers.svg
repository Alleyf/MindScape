<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="60" font-family="Arial, sans-serif" font-size="28" fill="#f5f5f5" text-anchor="middle" font-weight="bold" letter-spacing="1">BERT</text>
  <text x="600" y="95" font-family="Arial, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle">Bidirectional Encoder Representations from Transformers</text>

  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" font-weight="bold">LEFT CONTEXT</text>
    <line x1="0" y1="10" x2="100" y2="10" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="100,5 110,10 100,15" fill="#06b6d4"/>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#8b5cf6" font-weight="bold">RIGHT CONTEXT</text>
    <line x1="100" y1="60" x2="0" y2="60" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="0,55 -10,60 0,65" fill="#8b5cf6"/>
  </g>

  <g transform="translate(350, 130)">
    <rect x="0" y="0" width="300" height="380" rx="16" fill="#1c1917" stroke="url(#purple)" stroke-width="2"/>
    <rect x="20" y="20" width="260" height="50" rx="8" fill="#06b6d4" opacity="0.2"/>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">INPUT EMBEDDING + POSITIONAL ENCODING</text>
    <rect x="20" y="85" width="260" height="100" rx="8" fill="#8b5cf6" opacity="0.15"/>
    <text x="150" y="110" font-family="Arial, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">MULTI-HEAD SELF-ATTENTION</text>
    <g transform="translate(40, 125)">
      <rect x="0" y="0" width="50" height="40" rx="4" fill="#8b5cf6" opacity="0.4"/>
      <rect x="55" y="0" width="50" height="40" rx="4" fill="#8b5cf6" opacity="0.5"/>
      <rect x="110" y="0" width="50" height="40" rx="4" fill="#8b5cf6" opacity="0.6"/>
      <rect x="165" y="0" width="50" height="40" rx="4" fill="#8b5cf6" opacity="0.4"/>
      <text x="25" y="25" font-family="Arial, sans-serif" font-size="9" fill="#f5f5f5" text-anchor="middle">H1</text>
      <text x="80" y="25" font-family="Arial, sans-serif" font-size="9" fill="#f5f5f5" text-anchor="middle">H2</text>
      <text x="135" y="25" font-family="Arial, sans-serif" font-size="9" fill="#f5f5f5" text-anchor="middle">H3</text>
      <text x="190" y="25" font-family="Arial, sans-serif" font-size="9" fill="#f5f5f5" text-anchor="middle">H4</text>
    </g>
    <rect x="20" y="200" width="260" height="30" rx="6" fill="#f97316" opacity="0.3"/>
    <text x="150" y="220" font-family="Arial, sans-serif" font-size="11" fill="#fb923c" text-anchor="middle">ADD &amp; NORM</text>
    <rect x="20" y="245" width="260" height="50" rx="8" fill="#06b6d4" opacity="0.2"/>
    <text x="150" y="275" font-family="Arial, sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">FEED-FORWARD NETWORK</text>
    <rect x="20" y="310" width="260" height="30" rx="6" fill="#f97316" opacity="0.3"/>
    <text x="150" y="330" font-family="Arial, sans-serif" font-size="11" fill="#fb923c" text-anchor="middle">ADD &amp; NORM</text>
    <rect x="20" y="355" width="260" height="20" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="150" y="370" font-family="Arial, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">OUTPUT: [CLS] token</text>
  </g>

  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#1c1917" stroke="url(#cyan)" stroke-width="2"/>
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle" font-weight="bold">MLM</text>
    <text x="110" y="50" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Masked Language Model</text>
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="30" height="30" rx="4" fill="#8b5cf6"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle">The</text>
      <rect x="35" y="0" width="30" height="30" rx="4" fill="#06b6d4"/>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="14" fill="#0c0a09" text-anchor="middle" font-weight="bold">[M]</text>
      <rect x="70" y="0" width="30" height="30" rx="4" fill="#8b5cf6"/>
      <text x="85" y="20" font-family="Arial, sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle">cat</text>
      <rect x="105" y="0" width="30" height="30" rx="4" fill="#f97316"/>
      <text x="120" y="20" font-family="Arial, sans-serif" font-size="14" fill="#0c0a09" text-anchor="middle" font-weight="bold">[M]</text>
      <rect x="140" y="0" width="30" height="30" rx="4" fill="#8b5cf6"/>
      <text x="155" y="20" font-family="Arial, sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle">sat</text>
    </g>
    <text x="110" y="130" font-family="Arial, sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Predict masked tokens</text>
  </g>

  <g transform="translate(700, 320)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#1c1917" stroke="url(#orange)" stroke-width="2"/>
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="14" fill="#fb923c" text-anchor="middle" font-weight="bold">NSP</text>
    <text x="110" y="50" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Next Sentence Prediction</text>
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="180" height="35" rx="6" fill="#8b5cf6" opacity="0.3"/>
      <text x="90" y="22" font-family="Arial, sans-serif" font-size="10" fill="#f5f5f5" text-anchor="middle">Sentence A: [CLS] The cat...</text>
      <rect x="0" y="45" width="180" height="35" rx="6" fill="#06b6d4" opacity="0.3"/>
      <text x="90" y="67" font-family="Arial, sans-serif" font-size="10" fill="#f5f5f5" text-anchor="middle">Sentence B: [SEP] sat on...</text>
    </g>
    <text x="110" y="130" font-family="Arial, sans-serif" font-size="10" fill="#f97316" text-anchor="middle">Is B next to A?</text>
  </g>

  <g transform="translate(970, 200)">
    <text x="60" y="0" font-family="Arial, sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle" font-weight="bold">FINE-TUNING</text>
    <line x1="0" y1="15" x2="120" y2="15" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="120,10 130,15 120,20" fill="#22d3ee"/>
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="100" height="30" rx="6" fill="#8b5cf6" opacity="0.4"/>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="10" fill="#f5f5f5" text-anchor="middle">Question</text>
      <rect x="0" y="40" width="100" height="30" rx="6" fill="#8b5cf6" opacity="0.4"/>
      <text x="50" y="60" font-family="Arial, sans-serif" font-size="10" fill="#f5f5f5" text-anchor="middle">Sentiment</text>
    </g>
  </g>

  <text x="100" y="560" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" opacity="0.6">Devlin et al., 2018</text>
</svg>
