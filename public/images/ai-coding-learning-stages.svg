<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" aria-labelledby="title desc" role="img" viewBox="0 0 1040 360"><title id="title">AI Coding 四阶段学习路线</title><desc id="desc">能用起来、能稳定改仓库、能复用工作流、能做复杂项目四个阶段。</desc><rect width="1040" height="360" fill="#fffaf2" rx="32"/><text x="52" y="66" fill="#141413" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="800">四阶段学习节奏</text><text x="52" y="98" fill="#6b6258" font-family="'Microsoft YaHei UI', sans-serif" font-size="15">不要一次全学，把能力拆成四个台阶更稳。</text><g font-family="'Microsoft YaHei UI', sans-serif"><path fill="none" stroke="#d97757" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" d="M88 272h180v-52h180v-52h180v-52h260"/><g><circle cx="164" cy="272" r="34" fill="#d97757"/><text x="154" y="281" fill="#fff" font-size="24" font-weight="900">1</text><text x="104" y="326" fill="#141413" font-size="17" font-weight="800">能用起来</text></g><g><circle cx="372" cy="220" r="34" fill="#d97757"/><text x="362" y="229" fill="#fff" font-size="24" font-weight="900">2</text><text x="300" y="274" fill="#141413" font-size="17" font-weight="800">稳定改仓库</text></g><g><circle cx="580" cy="168" r="34" fill="#d97757"/><text x="570" y="177" fill="#fff" font-size="24" font-weight="900">3</text><text x="506" y="222" fill="#141413" font-size="17" font-weight="800">复用工作流</text></g><g><circle cx="788" cy="116" r="34" fill="#d97757"/><text x="778" y="125" fill="#fff" font-size="24" font-weight="900">4</text><text x="718" y="170" fill="#141413" font-size="17" font-weight="800">复杂项目推进</text></g></g></svg>