<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">云计算学习路线图</title>
  <desc id="desc">云计算及运维学习路线图，从Linux基础到Kubernetes集群管理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fff4"/>
      <stop offset="1" stop-color="#c6f6d5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38a169"/>
      <stop offset="1" stop-color="#276749"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#22543d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1040" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="918" cy="64" r="96" fill="#38a169" opacity="0.08"/>
  <circle cx="112" cy="302" r="128" fill="#276749" opacity="0.08"/>
  <text x="52" y="64" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="800" fill="#22543d">云计算学习路线图</text>
  <text x="52" y="98" font-family="'Microsoft YaHei UI', sans-serif" font-size="15" fill="#276749">Linux → Docker → K8S → 云原生 = 现代运维工程师</text>
  <path d="M112 210H910" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12"/>
  <g font-family="'Microsoft YaHei UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(52 146)">
      <rect width="150" height="118" rx="18" fill="#ffffff" stroke="#9ae6b4"/>
      <circle cx="34" cy="34" r="18" fill="#38a169"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">1</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#22543d">Linux基础</text>
      <text x="24" y="100" font-size="13" fill="#276749">Shell / 系统管理</text>
    </g>
    <g transform="translate(222 116)">
      <rect width="150" height="118" rx="18" fill="#ffffff" stroke="#9ae6b4"/>
      <circle cx="34" cy="34" r="18" fill="#38a169"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">2</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#22543d">虚拟化</text>
      <text x="24" y="100" font-size="13" fill="#276749">VMware / Docker</text>
    </g>
    <g transform="translate(392 146)">
      <rect width="150" height="118" rx="18" fill="#ffffff" stroke="#9ae6b4"/>
      <circle cx="34" cy="34" r="18" fill="#38a169"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">3</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#22543d">Kubernetes</text>
      <text x="24" y="100" font-size="13" fill="#276749">容器编排 / K8S</text>
    </g>
    <g transform="translate(562 116)">
      <rect width="150" height="118" rx="18" fill="#ffffff" stroke="#9ae6b4"/>
      <circle cx="34" cy="34" r="18" fill="#38a169"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">4</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#22543d">DevOps</text>
      <text x="24" y="100" font-size="13" fill="#276749">CI/CD / 自动化</text>
    </g>
    <g transform="translate(732 146)">
      <rect width="150" height="118" rx="18" fill="#ffffff" stroke="#9ae6b4"/>
      <circle cx="34" cy="34" r="18" fill="#38a169"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">5</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#22543d">云原生</text>
      <text x="24" y="100" font-size="13" fill="#276749">微服务 / Serverless</text>
    </g>
  </g>
</svg>