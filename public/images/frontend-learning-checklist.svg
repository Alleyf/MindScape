<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">前端学习路线图</title>
  <desc id="desc">React + Ant Design 前端速成学习路线图，从基础概念到项目实战。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f4ff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#2196f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a365d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1040" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="918" cy="64" r="96" fill="#4a90e2" opacity="0.08"/>
  <circle cx="112" cy="302" r="128" fill="#2196f3" opacity="0.08"/>
  <text x="52" y="64" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="800" fill="#1a365d">前端学习路线图</text>
  <text x="52" y="98" font-family="'Microsoft YaHei UI', sans-serif" font-size="15" fill="#4a5568">React 组件化 + Ant Design 组件库 + 路由状态管理 = 现代前端开发</text>
  <path d="M112 210H910" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12"/>
  <g font-family="'Microsoft YaHei UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(52 146)">
      <rect width="160" height="118" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="18" fill="#4a90e2"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">1</text>
      <text x="20" y="76" font-size="18" font-weight="800" fill="#1a365d">React基础</text>
      <text x="20" y="100" font-size="12" fill="#718096">组件 / JSX / Hooks</text>
    </g>
    <g transform="translate(232 116)">
      <rect width="160" height="118" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="18" fill="#4a90e2"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">2</text>
      <text x="20" y="76" font-size="18" font-weight="800" fill="#1a365d">Ant Design</text>
      <text x="20" y="100" font-size="12" fill="#718096">组件库 / 表单 / 表格</text>
    </g>
    <g transform="translate(412 146)">
      <rect width="160" height="118" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="18" fill="#4a90e2"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">3</text>
      <text x="20" y="76" font-size="18" font-weight="800" fill="#1a365d">路由状态</text>
      <text x="20" y="100" font-size="12" fill="#718096">Router / Redux / Context</text>
    </g>
    <g transform="translate(592 116)">
      <rect width="160" height="118" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="18" fill="#4a90e2"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">4</text>
      <text x="20" y="76" font-size="18" font-weight="800" fill="#1a365d">项目实战</text>
      <text x="20" y="100" font-size="12" fill="#718096">Ant Design Pro</text>
    </g>
    <g transform="translate(772 146)">
      <rect width="160" height="118" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="18" fill="#4a90e2"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">5</text>
      <text x="20" y="76" font-size="18" font-weight="800" fill="#1a365d">部署上线</text>
      <text x="20" y="100" font-size="12" fill="#718096">CI/CD / Nginx</text>
    </g>
  </g>
</svg>