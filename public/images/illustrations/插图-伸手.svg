<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="handLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="handRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg3)"/>

  <!-- Subtle particles -->
  <g fill="#475569" opacity="0.3">
    <circle cx="150" cy="100" r="2"/>
    <circle cx="650" cy="120" r="2"/>
    <circle cx="200" cy="300" r="1.5"/>
    <circle cx="600" cy="280" r="1.5"/>
    <circle cx="400" cy="80" r="1"/>
  </g>

  <!-- Left hand (gray - receiving support) -->
  <g transform="translate(280, 200)" filter="url(#glow3)">
    <path d="M0 0
             L-10 -30
             L-5 -32
             L-15 -55
             L-8 -57
             L-18 -80
             L-5 -85
             L-10 -100
             L10 -100
             L15 -85
             L20 -80
             L30 -55
             L35 -50
             L45 -30
             L40 0
             Z"
          fill="url(#handLeft)"
          opacity="0.7"/>
    <!-- Reaching toward center -->
    <path d="M30 -60 Q60 -70 80 -50"
          stroke="#64748b"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>

  <!-- Right hand (purple - giving guidance) -->
  <g transform="translate(520, 200)" filter="url(#glow3)">
    <path d="M0 0
             L-40 0
             L-45 -30
             L-40 -32
             L-48 -55
             L-42 -57
             L-50 -80
             L-42 -85
             L-45 -100
             L-25 -100
             L-20 -85
             L-15 -80
             L-5 -55
             L0 -50
             L10 -30
             L5 0
             Z"
          fill="url(#handRight)"
          opacity="0.8"/>
    <!-- Reaching toward center -->
    <path d="M-35 -60 Q-60 -70 -80 -50"
          stroke="#8b5cf6"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>
  </g>

  <!-- Connection point - spark/gap between hands -->
  <g transform="translate(400, 145)">
    <circle r="12" fill="#6366f1" opacity="0.4" filter="url(#glow3)">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#a78bfa">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Light rays -->
    <g stroke="#c4b5fd" stroke-width="1" opacity="0.6">
      <line x1="0" y1="-15" x2="0" y2="-25"/>
      <line x1="10" y1="-10" x2="18" y2="-18"/>
      <line x1="-10" y1="-10" x2="-18" y2="-18"/>
    </g>
  </g>

  <!-- Bottom text -->
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">
    接住他们伸过来的那只手
  </text>

  <!-- Side labels -->
  <text x="180" y="380" font-family="sans-serif" font-size="11" fill="#64748b">被支持者</text>
  <text x="600" y="380" font-family="sans-serif" font-size="11" fill="#8b5cf6">引导者</text>

  <!-- Connecting arc -->
  <path d="M200 360 Q400 320 600 360"
        stroke="#334155"
        stroke-width="1"
        stroke-dasharray="4,4"
        fill="none"
        opacity="0.4"/>
</svg>
