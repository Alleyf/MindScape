<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Left person silhouette -->
  <g transform="translate(150, 280)">
    <circle cx="0" cy="-60" r="25" fill="#475569"/>
    <path d="M-20 0 Q-25 -40 0 -50 Q25 -40 20 0" fill="#475569"/>
  </g>

  <!-- Mirror frame -->
  <g transform="translate(350, 80)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="200" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <!-- Mirror surface -->
    <rect x="15" y="15" width="170" height="230" rx="4" fill="url(#mirrorGrad)"/>
    <!-- Reflection effect -->
    <rect x="15" y="15" width="170" height="230" rx="4" fill="url(#reflection)"/>

    <!-- Reflection of person (slightly different pose) -->
    <g transform="translate(100, 130)" filter="url(#glow)">
      <circle cx="0" cy="-40" r="20" fill="#6366f1" opacity="0.6"/>
      <path d="M-15 10 Q-20 -30 0 -38 Q20 -30 15 10" fill="#6366f1" opacity="0.6"/>
      <!-- Question mark above head -->
      <text x="25" y="-55" font-family="sans-serif" font-size="24" fill="#a78bfa" opacity="0.8">?</text>
    </g>

    <!-- Mirror label -->
    <text x="100" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">映照 · 反思</text>
  </g>

  <!-- Right person silhouette (growth) -->
  <g transform="translate(650, 260)">
    <circle cx="0" cy="-70" r="25" fill="#6366f1"/>
    <path d="M-20 -10 Q-25 -50 0 -60 Q25 -50 20 -10" fill="#6366f1"/>
    <!-- Growth arrow -->
    <path d="M0 -90 L0 -120 M-10 -110 L0 -120 L10 -110" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Connecting path -->
  <path d="M200 250 Q400 180 550 230" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.5"/>
  <circle cx="400" cy="200" r="4" fill="#6366f1" opacity="0.6"/>

  <!-- Bottom text -->
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">
    他们像一面镜子，映出你从未注意过的自己
  </text>
</svg>
