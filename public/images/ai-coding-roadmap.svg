<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" aria-labelledby="title desc" role="img" viewBox="0 0 1040 360"><title id="title">AI Coding 学习路线图</title><desc id="desc">从概念扫盲到工具实践、工作模式、方法论和验证闭环的学习路径。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f1e7da"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d97757"/><stop offset="1" stop-color="#8f4f32"/></linearGradient><filter id="shadow" width="140%" height="180%" x="-20%" y="-40%"><feDropShadow dx="0" dy="14" flood-color="#40342a" flood-opacity=".16" stdDeviation="18"/></filter></defs><rect width="1040" height="360" fill="url(#bg)" rx="32"/><circle cx="918" cy="64" r="96" fill="#d97757" opacity=".08"/><circle cx="112" cy="302" r="128" fill="#6f7669" opacity=".1"/><text x="52" y="64" fill="#141413" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="800">AI Coding 学习路线</text><text x="52" y="98" fill="#6b6258" font-family="'Microsoft YaHei UI', sans-serif" font-size="15">先建立概念，再使用工具，最后沉淀成可验证、可复用的工程流程。</text><path stroke="url(#accent)" stroke-dasharray="12 12" stroke-linecap="round" stroke-width="4" d="M112 210H910"/><g filter="url(#shadow)" font-family="'Microsoft YaHei UI', sans-serif"><g transform="translate(52 146)"><rect width="150" height="118" fill="#fffdfa" stroke="#e5d7c8" rx="18"/><circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" fill="#fff" font-size="18" font-weight="800">1</text><text x="24" y="76" fill="#141413" font-size="19" font-weight="800">概念扫盲</text><text x="24" y="100" fill="#7d7468" font-size="13">上下文 / Agent / MCP</text></g><g transform="translate(222 116)"><rect width="150" height="118" fill="#fffdfa" stroke="#e5d7c8" rx="18"/><circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" fill="#fff" font-size="18" font-weight="800">2</text><text x="24" y="76" fill="#141413" font-size="19" font-weig