<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding 学习路线图</title>
  <desc id="desc">从概念扫盲到工具实践、工作模式、方法论和验证闭环的学习路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f1e7da"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#8f4f32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#40342a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1040" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="918" cy="64" r="96" fill="#d97757" opacity="0.08"/>
  <circle cx="112" cy="302" r="128" fill="#6f7669" opacity="0.1"/>
  <text x="52" y="64" font-family="Georgia, 'Noto Serif SC', serif" font-size="32" font-weight="800" fill="#141413">AI Coding 学习路线</text>
  <text x="52" y="98" font-family="'Microsoft YaHei UI', sans-serif" font-size="15" fill="#6b6258">先建立概念，再使用工具，最后沉淀成可验证、可复用的工程流程。</text>
  <path d="M112 210H910" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12"/>
  <g font-family="'Microsoft YaHei UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(52 146)">
      <rect width="150" height="118" rx="18" fill="#fffdfa" stroke="#e5d7c8"/>
      <circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">1</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#141413">概念扫盲</text>
      <text x="24" y="100" font-size="13" fill="#7d7468">上下文 / Agent / MCP</text>
    </g>
    <g transform="translate(222 116)">
      <rect width="150" height="118" rx="18" fill="#fffdfa" stroke="#e5d7c8"/>
      <circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">2</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#141413">工具实践</text>
      <text x="24" y="100" font-size="13" fill="#7d7468">Codex / Claude Code</text>
    </g>
    <g transform="translate(392 146)">
      <rect width="150" height="118" rx="18" fill="#fffdfa" stroke="#e5d7c8"/>
      <circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">3</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#141413">工作模式</text>
      <text x="24" y="100" font-size="13" fill="#7d7468">Vibe / Plan / Spec</text>
    </g>
    <g transform="translate(562 116)">
      <rect width="150" height="118" rx="18" fill="#fffdfa" stroke="#e5d7c8"/>
      <circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">4</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#141413">方法论</text>
      <text x="24" y="100" font-size="13" fill="#7d7468">GSD / OpenSpec</text>
    </g>
    <g transform="translate(732 146)">
      <rect width="150" height="118" rx="18" fill="#fffdfa" stroke="#e5d7c8"/>
      <circle cx="34" cy="34" r="18" fill="#d97757"/><text x="29" y="40" font-size="18" font-weight="800" fill="#fff">5</text>
      <text x="24" y="76" font-size="19" font-weight="800" fill="#141413">验证闭环</text>
      <text x="24" y="100" font-size="13" fill="#7d7468">测试 / Review / Eval</text>
    </g>
  </g>
</svg>
